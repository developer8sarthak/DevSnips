      const tabs = root.querySelectorAll('[data-tab]');

      const ct = root.querySelector('[data-cap-title]'), cb = root.querySelector('[data-cap-body]'), cg = root.querySelector('[data-cap-tag]');
      const caps = { "1":{t:"Inbox · triage view",b:"AI-routed queue with live SLA indicators.",tag:"/inbox"},"2":{t:"Analytics · realtime",b:"Cohort revenue and reply-time at a glance.",tag:"/analytics"},"3":{t:"Automations · builder",b:"Branch on intent, sentiment, and customer tier.",tag:"/automations"} };
      function set(n) {
        tabs.forEach(t => { const a = t.dataset.tab === n; t.setAttribute('aria-pressed', a ? 'true' : 'false'); t.classList.toggle("border-[#50e3c2]/40",active); t.classList.toggle("bg-white/[0.06]",active); });
        shots.forEach(s => s.classList.toggle('hidden', s.dataset.shot !== n));
        const c = caps[n]; if(ct)ct.textContent=c.t; if(cb)cb.textContent=c.b; if(cg)cg.textContent=c.tag;
