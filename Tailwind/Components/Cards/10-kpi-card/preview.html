<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPI Card - Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center p-8">
  
  <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden w-full max-w-md">
    <div class="p-5 pb-3">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-semibold text-gray-900">Key Performance Indicators</h3>
        <span class="text-xs text-gray-400">Q4 2024</span>
      </div>
      
      <div class="grid grid-cols-2 gap-4">
        <div class="bg-gradient-to-br from-emerald-50 to-green-50 rounded-xl p-4 border border-emerald-100/50">
          <div class="flex items-center gap-2 mb-2">
            <div class="w-8 h-8 rounded-lg bg-emerald-500 flex items-center justify-center">
              <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
            </div>
            <span class="text-xs font-medium text-emerald-700">ON TARGET</span>
          </div>
          <p class="text-2xl font-bold text-gray-900">94.2%</p>
          <p class="text-xs text-gray-500 mt-1">Goal Completion</p>
          <div class="mt-2 h-1.5 bg-emerald-200 rounded-full overflow-hidden">
            <div class="h-full bg-emerald-500 rounded-full" style="width: 94.2%"></div>
          </div>
        </div>
        
        <div class="bg-gradient-to-br from-blue-50 to-indigo-50 rounded-xl p-4 border border-blue-100/50">
          <div class="flex items-center gap-2 mb-2">
            <div class="w-8 h-8 rounded-lg bg-blue-500 flex items-center justify-center">
              <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
            </div>
            <span class="text-xs font-medium text-blue-700">STEADY</span>
          </div>
          <p class="text-2xl font-bold text-gray-900">127</p>
          <p class="text-xs text-gray-500 mt-1">Active Clients</p>
          <div class="mt-2 h-1.5 bg-blue-200 rounded-full overflow-hidden">
            <div class="h-full bg-blue-500 rounded-full" style="width: 78%"></div>
          </div>
        </div>
        
        <div class="bg-gradient-to-br from-amber-50 to-orange-50 rounded-xl p-4 border border-amber-100/50">
          <div class="flex items-center gap-2 mb-2">
            <div class="w-8 h-8 rounded-lg bg-amber-500 flex items-center justify-center">
              <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
            </div>
            <span class="text-xs font-medium text-amber-700">MONTHLY</span>
          </div>
          <p class="text-2xl font-bold text-gray-900">$2.4M</p>
          <p class="text-xs text-gray-500 mt-1">Revenue</p>
          <div class="mt-2 h-1.5 bg-amber-200 rounded-full overflow-hidden">
            <div class="h-full bg-amber-500 rounded-full" style="width: 85%"></div>
          </div>
        </div>
        
        <div class="bg-gradient-to-br from-violet-50 to-purple-50 rounded-xl p-4 border border-violet-100/50">
          <div class="flex items-center gap-2 mb-2">
            <div class="w-8 h-8 rounded-lg bg-violet-500 flex items-center justify-center">
              <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
              </svg>
            </div>
            <span class="text-xs font-medium text-violet-700">EXCEEDED</span>
          </div>
          <p class="text-2xl font-bold text-gray-900">156%</p>
          <p class="text-xs text-gray-500 mt-1">NPS Score</p>
          <div class="mt-2 h-1.5 bg-violet-200 rounded-full overflow-hidden">
            <div class="h-full bg-violet-500 rounded-full" style="width: 100%"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
