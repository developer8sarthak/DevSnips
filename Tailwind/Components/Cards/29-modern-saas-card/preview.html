<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern SaaS Card - Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center p-8">
  
  <div class="relative bg-white rounded-2xl p-6 shadow-sm border border-gray-100 overflow-hidden w-full max-w-sm">
    <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-br from-blue-100/50 to-purple-100/50 rounded-full blur-2xl -translate-y-1/2 translate-x-1/2"></div>
    
    <div class="relative">
      <div class="flex items-center justify-between mb-5">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center shadow-lg shadow-blue-500/20">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
            </svg>
          </div>
          <div>
            <h3 class="font-semibold text-gray-900">Analytics Overview</h3>
            <p class="text-xs text-gray-500">Last 30 days</p>
          </div>
        </div>
        <select class="text-xs bg-gray-100 border-0 rounded-lg px-3 py-2 text-gray-600 focus:ring-2 focus:ring-blue-500">
          <option>Last 30 days</option>
          <option>Last 7 days</option>
        </select>
      </div>
      
      <div class="flex items-end gap-6 mb-5">
        <div>
          <p class="text-3xl font-bold text-gray-900">284,521</p>
          <p class="text-sm text-gray-500 mt-1">Total Visitors</p>
        </div>
        <div class="flex items-center gap-1 text-sm text-green-600 font-medium pb-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/>
          </svg>
          <span>+18.2%</span>
        </div>
      </div>
      
      <div class="h-20 flex items-end gap-1 mb-4">
        <div class="flex-1 bg-blue-100 rounded-t-lg" style="height: 45%"></div>
        <div class="flex-1 bg-blue-200 rounded-t-lg" style="height: 60%"></div>
        <div class="flex-1 bg-blue-200 rounded-t-lg" style="height: 55%"></div>
        <div class="flex-1 bg-blue-300 rounded-t-lg" style="height: 70%"></div>
        <div class="flex-1 bg-blue-300 rounded-t-lg" style="height: 65%"></div>
        <div class="flex-1 bg-blue-400 rounded-t-lg" style="height: 85%"></div>
        <div class="flex-1 bg-blue-400 rounded-t-lg" style="height: 78%"></div>
        <div class="flex-1 bg-blue-500 rounded-t-lg" style="height: 92%"></div>
        <div class="flex-1 bg-blue-500 rounded-t-lg" style="height: 88%"></div>
        <div class="flex-1 bg-blue-600 rounded-t-lg" style="height: 100%"></div>
      </div>
      
      <div class="grid grid-cols-3 gap-3 pt-4 border-t border-gray-100">
        <div class="text-center">
          <p class="text-lg font-bold text-gray-900">4.2m</p>
          <p class="text-xs text-gray-500">Page Views</p>
        </div>
        <div class="text-center border-x border-gray-100">
          <p class="text-lg font-bold text-gray-900">68%</p>
          <p class="text-xs text-gray-500">Bounce Rate</p>
        </div>
        <div class="text-center">
          <p class="text-lg font-bold text-gray-900">3:42</p>
          <p class="text-xs text-gray-500">Avg. Time</p>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
