<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metric Card - Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center p-8">
  
  <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 w-full max-w-xs">
    <div class="flex items-start justify-between mb-3">
      <div class="p-2.5 rounded-xl bg-indigo-50">
        <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
        </svg>
      </div>
      <span class="flex items-center gap-1 text-xs font-medium text-green-600">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/>
        </svg>
        +12.5%
      </span>
    </div>
    
    <p class="text-sm text-gray-500 mb-1">Monthly Active Users</p>
    <p class="text-2xl font-bold text-gray-900">2.4M</p>
    
    <div class="mt-4 h-8 flex items-end gap-0.5">
      <div class="flex-1 bg-indigo-200 rounded-t" style="height: 40%"></div>
      <div class="flex-1 bg-indigo-300 rounded-t" style="height: 55%"></div>
      <div class="flex-1 bg-indigo-300 rounded-t" style="height: 50%"></div>
      <div class="flex-1 bg-indigo-400 rounded-t" style="height: 70%"></div>
      <div class="flex-1 bg-indigo-400 rounded-t" style="height: 65%"></div>
      <div class="flex-1 bg-indigo-500 rounded-t" style="height: 85%"></div>
      <div class="flex-1 bg-indigo-500 rounded-t" style="height: 80%"></div>
      <div class="flex-1 bg-indigo-600 rounded-t" style="height: 92%"></div>
      <div class="flex-1 bg-indigo-600 rounded-t" style="height: 88%"></div>
      <div class="flex-1 bg-indigo-700 rounded-t" style="height: 100%"></div>
    </div>
  </div>

</body>
</html>
