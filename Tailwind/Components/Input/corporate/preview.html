<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corporate Input | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="p-6 bg-white border-b">
      <h1 class="text-2xl font-bold text-gray-900">Input — Corporate</h1>
      <p class="text-gray-600 mt-1">Enterprise-style form inputs with proper hierarchy</p>
    </header>

    <div class="space-y-4 px-6">
      <h2 class="text-lg font-semibold text-gray-800">Preview</h2>
      
      <div class="p-6 bg-white rounded-lg shadow-sm border border-gray-200">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-semibold text-gray-900">Employee Information</h3>
          <span class="text-xs text-gray-500 uppercase tracking-wide">Step 1 of 3</span>
        </div>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Employee ID</label>
            <input type="text" placeholder="EMP-00000" class="w-full px-3 py-2 bg-gray-50 border border-gray-300 text-sm focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Department</label>
            <input type="text" placeholder="Select department" class="w-full px-3 py-2 bg-gray-50 border border-gray-300 text-sm focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600" />
          </div>
        </div>
      </div>

      <div class="bg-gray-50 p-6 rounded-lg">
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
          <h4 class="text-base font-semibold text-gray-900 mb-4 pb-3 border-b border-gray-100">Contact Details</h4>
          <div class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">First Name</label>
                <input type="text" class="w-full px-3 py-2 border border-gray-300 text-sm focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600" />
              </div>
              <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">Last Name</label>
                <input type="text" class="w-full px-3 py-2 border border-gray-300 text-sm focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600" />
              </div>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Business Email</label>
              <input type="email" class="w-full px-3 py-2 border border-gray-300 text-sm focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600" />
            </div>
          </div>
          <div class="mt-6 pt-4 border-t border-gray-100 flex justify-end gap-3">
            <button class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800">Cancel</button>
            <button class="px-4 py-2 text-sm bg-blue-600 text-white rounded hover:bg-blue-700">Save Changes</button>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-8 mx-6 p-4 bg-blue-50 rounded-lg border border-blue-200">
      <p class="text-sm text-blue-800"><strong>Style:</strong> Corporate inputs prioritize clarity and hierarchy. Smaller text, subtle backgrounds, and proper spacing.</p>
    </div>
  </section>

</body>
</html>
