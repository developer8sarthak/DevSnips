<!-- URL Input - Standard -->
<div>
  <label class="block text-sm font-medium text-gray-700 mb-1">Website URL</label>
  <input type="url" placeholder="https://example.com" class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" />
</div>

<!-- URL Input - With Prefix -->
<div class="mt-4">
  <label class="block text-sm font-medium text-gray-700 mb-1">Portfolio Link</label>
  <div class="flex">
    <span class="inline-flex items-center px-4 py-3 bg-gray-100 border border-r-0 border-gray-300 rounded-l-lg text-sm text-gray-500">https://</span>
    <input type="text" placeholder="your-site.com" class="flex-1 px-4 py-3 bg-white border border-gray-300 rounded-r-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" />
  </div>
</div>

<!-- URL Input - With Icon -->
<div class="mt-4">
  <label class="block text-sm font-medium text-gray-700 mb-1">Your Website</label>
  <div class="relative">
    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
      <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
      </svg>
    </div>
    <input type="url" placeholder="www.example.com" class="w-full pl-10 pr-4 py-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-colors" />
  </div>
</div>

<!-- URL Input - Link Preview -->
<div class="mt-4 p-4 bg-gray-50 rounded-xl">
  <label class="block text-sm font-medium text-gray-700 mb-2">Link Preview</label>
  <input type="url" placeholder="Paste a URL to see preview" class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors" />
  <div class="mt-3 p-3 bg-white border border-gray-200 rounded-lg">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 bg-gray-200 rounded flex items-center justify-center">
        <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium text-gray-900 truncate">Example Domain</p>
        <p class="text-xs text-gray-500 truncate">www.example.com</p>
      </div>
    </div>
  </div>
</div>
