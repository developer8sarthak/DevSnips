<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Input | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Input — URL</h1>
      <p class="text-gray-600 mt-2">URL input components with link preview functionality</p>
    </header>
    <div class="p-6 bg-white rounded-xl shadow-sm space-y-5 max-w-md">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Website URL</label>
        <input type="url" placeholder="https://example.com" class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Portfolio Link (with Prefix)</label>
        <div class="flex">
          <span class="inline-flex items-center px-4 py-3 bg-gray-100 border border-r-0 border-gray-300 rounded-l-lg text-sm text-gray-500">https://</span>
          <input type="text" placeholder="your-site.com" class="flex-1 px-4 py-3 bg-white border border-gray-300 rounded-r-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
      </div>
      <div class="p-4 bg-gray-50 rounded-xl">
        <label class="block text-sm font-medium text-gray-700 mb-2">Link Preview</label>
        <input type="url" placeholder="Paste a URL" class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <div class="mt-3 p-3 bg-white border border-gray-200 rounded-lg">
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 bg-gray-200 rounded flex items-center justify-center">📄</div>
            <div><p class="text-sm font-medium">Example Domain</p><p class="text-xs text-gray-500">www.example.com</p></div>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
