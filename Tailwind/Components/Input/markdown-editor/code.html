<!-- Markdown Editor - Simple -->
<div>
  <label class="block text-sm font-medium text-gray-700 mb-1">Description (Markdown)</label>
  <textarea rows="4" placeholder="Write your content here using **Markdown**..." class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors font-mono text-sm resize-none"></textarea>
</div>

<!-- Markdown Editor - With Toolbar -->
<div class="mt-4">
  <label class="block text-sm font-medium text-gray-700 mb-1">Content</label>
  <div class="border border-gray-300 rounded-lg overflow-hidden focus-within:ring-2 focus-within:ring-blue-500 focus-within:border-blue-500">
    <div class="flex items-center gap-1 p-2 bg-gray-50 border-b border-gray-300">
      <button class="p-2 text-gray-600 hover:bg-gray-200 rounded transition-colors" title="Bold">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 4h8a4 4 0 014 4 4 4 0 01-4 4H6z M6 12h9a4 4 0 014 4 4 4 0 01-4 4H6z" />
        </svg>
      </button>
      <button class="p-2 text-gray-600 hover:bg-gray-200 rounded transition-colors" title="Italic">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
        </svg>
      </button>
      <button class="p-2 text-gray-600 hover:bg-gray-200 rounded transition-colors" title="Heading">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z" />
        </svg>
      </button>
      <div class="w-px h-5 bg-gray-300 mx-1"></div>
      <button class="p-2 text-gray-600 hover:bg-gray-200 rounded transition-colors" title="Link">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
        </svg>
      </button>
      <button class="p-2 text-gray-600 hover:bg-gray-200 rounded transition-colors" title="Code">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
        </svg>
      </button>
      <button class="p-2 text-gray-600 hover:bg-gray-200 rounded transition-colors" title="List">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
        </svg>
      </button>
    </div>
    <textarea rows="6" placeholder="# Heading&#10;&#10;Write your **markdown** content here..." class="w-full px-4 py-3 bg-white focus:outline-none font-mono text-sm resize-none"></textarea>
  </div>
  <p class="mt-2 text-xs text-gray-500">Supports Markdown formatting</p>
</div>

<!-- Markdown Editor - Dark -->
<div class="mt-4 p-4 bg-slate-900 rounded-xl">
  <label class="block text-sm font-medium text-gray-300 mb-1">README.md</label>
  <textarea rows="5" placeholder="# My Project&#10;&#10;Description here..." class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-400 font-mono text-sm resize-none"></textarea>
</div>
