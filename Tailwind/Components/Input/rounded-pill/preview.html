<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rounded Pill Input | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Input — Rounded Pill</h1>
      <p class="text-gray-600 mt-2">Fully rounded pill-style input fields</p>
    </header>

    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Preview</h2>
      <div class="p-6 bg-white rounded-xl shadow-sm space-y-5 max-w-md">
        <div class="relative">
          <input type="text" placeholder="Search..." class="w-full px-5 py-3 bg-gray-100 border-0 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-colors" />
        </div>

        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </div>
          <input type="text" placeholder="Search anything..." class="w-full pl-12 pr-5 py-3 bg-white border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-colors" />
        </div>

        <div class="relative">
          <input type="email" placeholder="Enter your email" class="w-full px-5 py-3 bg-transparent border-2 border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-blue-50 transition-colors" />
        </div>

        <div class="p-4 bg-slate-900 rounded-2xl">
          <div class="relative">
            <input type="text" placeholder="Command input..." class="w-full px-5 py-3 bg-slate-800 border border-slate-600 rounded-full text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition-colors" />
          </div>
        </div>
      </div>
    </div>

    <div class="mt-8 p-4 bg-rose-50 rounded-lg border border-rose-200">
      <p class="text-sm text-rose-800"><strong>Style:</strong> Pill-shaped inputs are friendly and modern, great for search bars and mobile-first designs.</p>
    </div>
  </section>

</body>
</html>
