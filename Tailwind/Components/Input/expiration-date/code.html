<!-- Expiration Date - Standard -->
<div>
  <label class="block text-sm font-medium text-gray-700 mb-1">Expiration Date</label>
  <input type="text" placeholder="MM/YY" class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" />
</div>

<!-- Expiration Date - Split -->
<div class="mt-4">
  <label class="block text-sm font-medium text-gray-700 mb-1">Card Expiration</label>
  <div class="flex items-center gap-3">
    <select class="px-4 py-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      <option>Month</option><option>01</option><option>02</option><option>03</option><option>04</option><option>05</option><option>06</option><option>07</option><option>08</option><option>09</option><option>10</option><option>11</option><option>12</option>
    </select>
    <span class="text-gray-400">/</span>
    <select class="px-4 py-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      <option>Year</option><option>2024</option><option>2025</option><option>2026</option><option>2027</option>
    </select>
  </div>
</div>

<!-- Expiration Date - Compact -->
<div class="mt-4">
  <label class="block text-sm font-medium text-gray-700 mb-1">Expires</label>
  <div class="flex items-center gap-2">
    <input type="text" maxlength="2" placeholder="MM" class="w-16 px-3 py-3 bg-gray-50 border border-gray-200 rounded-lg text-center font-medium focus:outline-none focus:ring-2 focus:ring-blue-500" />
    <span class="text-xl text-gray-400 font-light">/</span>
    <input type="text" maxlength="2" placeholder="YY" class="w-16 px-3 py-3 bg-gray-50 border border-gray-200 rounded-lg text-center font-medium focus:outline-none focus:ring-2 focus:ring-blue-500" />
  </div>
</div>

<!-- Expiration Date - Calendar Style -->
<div class="mt-4">
  <label class="block text-sm font-medium text-gray-700 mb-1">Valid Until</label>
  <div class="flex items-center gap-3 p-4 bg-white border border-gray-200 rounded-xl">
    <div class="flex flex-col items-center justify-center w-16 h-16 bg-blue-50 rounded-lg">
      <span class="text-2xl font-bold text-blue-600">12</span>
      <span class="text-xs text-blue-500">DEC</span>
    </div>
    <div class="flex-1">
      <input type="text" value="December 2025" class="w-full bg-transparent text-lg font-medium text-gray-900 focus:outline-none" />
      <p class="text-sm text-gray-500">Expires end of month</p>
    </div>
    <button class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
    </button>
  </div>
</div>
