<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expiration Date Input | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Input — Expiration Date</h1>
      <p class="text-gray-600 mt-2">Expiration date input components for card and subscription forms</p>
    </header>
    <div class="p-6 bg-white rounded-xl shadow-sm space-y-5 max-w-md">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Expiration Date</label>
        <input type="text" placeholder="MM/YY" class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Card Expiration (Split)</label>
        <div class="flex items-center gap-3">
          <select class="px-4 py-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option>Month</option><option>01</option><option>02</option><option>03</option><option>04</option><option>05</option><option>06</option><option>07</option><option>08</option><option>09</option><option>10</option><option>11</option><option>12</option>
          </select>
          <span class="text-gray-400">/</span>
          <select class="px-4 py-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option>Year</option><option>2024</option><option>2025</option><option>2026</option><option>2027</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Valid Until (Calendar)</label>
        <div class="flex items-center gap-3 p-4 bg-white border border-gray-200 rounded-xl">
          <div class="flex flex-col items-center justify-center w-16 h-16 bg-blue-50 rounded-lg">
            <span class="text-2xl font-bold text-blue-600">12</span>
            <span class="text-xs text-blue-500">DEC</span>
          </div>
          <div class="flex-1">
            <input type="text" value="December 2025" class="w-full bg-transparent text-lg font-medium text-gray-900 focus:outline-none" />
            <p class="text-sm text-gray-500">Expires end of month</p>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
