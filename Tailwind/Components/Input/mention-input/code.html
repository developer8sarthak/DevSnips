<!-- Mention Input - Standard -->
<div>
  <label class="block text-sm font-medium text-gray-700 mb-1">Tag someone</label>
  <div class="relative">
    <input type="text" placeholder="@username" class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" />
  </div>
  <p class="mt-2 text-sm text-gray-500">Type @ to mention someone</p>
</div>

<!-- Mention Input - With Dropdown -->
<div class="mt-4">
  <label class="block text-sm font-medium text-gray-700 mb-1">Comment</label>
  <div class="relative">
    <textarea rows="3" placeholder="Write a comment... Use @ to mention" class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors resize-none"></textarea>
    <div class="absolute bottom-3 left-3 right-3 bg-white border border-gray-200 rounded-lg shadow-lg overflow-hidden">
      <p class="px-3 py-2 text-xs text-gray-500 border-b border-gray-100">Suggestions</p>
      <div class="max-h-40 overflow-y-auto">
        <div class="px-3 py-2 hover:bg-gray-50 cursor-pointer flex items-center gap-3">
          <div class="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center text-white text-sm font-medium">JD</div>
          <div>
            <p class="text-sm font-medium text-gray-900">@johndoe</p>
            <p class="text-xs text-gray-500">John Doe</p>
          </div>
        </div>
        <div class="px-3 py-2 hover:bg-gray-50 cursor-pointer flex items-center gap-3">
          <div class="w-8 h-8 bg-purple-500 rounded-full flex items-center justify-center text-white text-sm font-medium">AS</div>
          <div>
            <p class="text-sm font-medium text-gray-900">@alicesmith</p>
            <p class="text-xs text-gray-500">Alice Smith</p>
          </div>
        </div>
        <div class="px-3 py-2 hover:bg-gray-50 cursor-pointer flex items-center gap-3">
          <div class="w-8 h-8 bg-green-500 rounded-full flex items-center justify-center text-white text-sm font-medium">MJ</div>
          <div>
            <p class="text-sm font-medium text-gray-900">@mikejohnson</p>
            <p class="text-xs text-gray-500">Mike Johnson</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Mention Input - Tag Style -->
<div class="mt-4">
  <label class="block text-sm font-medium text-gray-700 mb-2">Notify team members</label>
  <div class="p-3 bg-white border border-gray-300 rounded-lg focus-within:ring-2 focus-within:ring-blue-500 focus-within:border-blue-500 transition-colors">
    <div class="flex flex-wrap gap-2 mb-2">
      <span class="px-2 py-1 bg-blue-100 text-blue-700 text-sm rounded flex items-center gap-1">
        <span>@</span>johndoe
        <button class="hover:text-blue-900">×</button>
      </span>
      <span class="px-2 py-1 bg-purple-100 text-purple-700 text-sm rounded flex items-center gap-1">
        <span>@</span>alicesmith
        <button class="hover:text-purple-900">×</button>
      </span>
    </div>
    <input type="text" placeholder="Add more mentions..." class="w-full bg-transparent border-0 focus:outline-none text-sm" />
  </div>
</div>

<!-- Mention Input - Dark -->
<div class="mt-4 p-4 bg-slate-900 rounded-xl">
  <label class="block text-sm font-medium text-gray-300 mb-2">Share with</label>
  <div class="relative">
    <input type="text" placeholder="@search users" class="w-full px-4 py-3 bg-slate-800 border border-slate-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition-colors" />
    <div class="absolute z-10 w-full mt-2 bg-slate-800 border border-slate-600 rounded-lg shadow-xl">
      <div class="p-2 hover:bg-slate-700 cursor-pointer flex items-center gap-3">
        <div class="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center text-white text-sm font-medium">JD</div>
        <div>
          <p class="text-sm font-medium text-white">John Doe</p>
          <p class="text-xs text-gray-400">johndoe</p>
        </div>
      </div>
    </div>
  </div>
</div>
