<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mention Input | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Input — Mention</h1>
      <p class="text-gray-600 mt-2">Mention input components with user suggestions</p>
    </header>
    <div class="p-6 bg-white rounded-xl shadow-sm space-y-5 max-w-md">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Tag someone</label>
        <input type="text" placeholder="@username" class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" />
        <p class="mt-2 text-sm text-gray-500">Type @ to mention someone</p>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Comment (with Suggestions)</label>
        <textarea rows="3" placeholder="Write a comment... Use @ to mention" class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors resize-none"></textarea>
        <div class="mt-2 bg-white border border-gray-200 rounded-lg shadow-lg overflow-hidden">
          <p class="px-3 py-2 text-xs text-gray-500 border-b border-gray-100">Suggestions</p>
          <div class="p-2 hover:bg-gray-50 cursor-pointer flex items-center gap-3"><div class="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center text-white text-sm">JD</div><div><p class="text-sm font-medium">@johndoe</p><p class="text-xs text-gray-500">John Doe</p></div></div>
          <div class="p-2 hover:bg-gray-50 cursor-pointer flex items-center gap-3"><div class="w-8 h-8 bg-purple-500 rounded-full flex items-center justify-center text-white text-sm">AS</div><div><p class="text-sm font-medium">@alicesmith</p><p class="text-xs text-gray-500">Alice Smith</p></div></div>
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Notify team members (Tag Style)</label>
        <div class="p-3 bg-white border border-gray-300 rounded-lg">
          <div class="flex flex-wrap gap-2 mb-2">
            <span class="px-2 py-1 bg-blue-100 text-blue-700 text-sm rounded flex items-center gap-1">@johndoe <button class="hover:text-blue-900">×</button></span>
            <span class="px-2 py-1 bg-purple-100 text-purple-700 text-sm rounded flex items-center gap-1">@alicesmith <button class="hover:text-purple-900">×</button></span>
          </div>
          <input type="text" placeholder="Add more mentions..." class="w-full bg-transparent border-0 focus:outline-none text-sm" />
        </div>
      </div>
      <div class="p-4 bg-slate-900 rounded-xl">
        <label class="block text-sm font-medium text-gray-300 mb-2">Share with (Dark)</label>
        <input type="text" placeholder="@search users" class="w-full px-4 py-3 bg-slate-800 border border-slate-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-colors" />
      </div>
    </div>
  </section>
</body>
</html>
