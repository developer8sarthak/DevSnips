<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rich Text Editor | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Input — Rich Text Editor</h1>
      <p class="text-gray-600 mt-2">Rich text editor components with formatting toolbar</p>
    </header>
    <div class="p-6 bg-white rounded-xl shadow-sm space-y-5 max-w-lg">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Article Content</label>
        <div class="border border-gray-300 rounded-xl overflow-hidden shadow-sm">
          <div class="flex flex-wrap items-center gap-1 p-3 bg-gray-50 border-b border-gray-200">
            <select class="px-3 py-1.5 bg-white border border-gray-200 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
              <option>Paragraph</option>
              <option>Heading 1</option>
              <option>Heading 2</option>
            </select>
            <div class="w-px h-6 bg-gray-300 mx-1"></div>
            <button class="p-2 text-gray-700 hover:bg-gray-200 rounded transition-colors font-bold">B</button>
            <button class="p-2 text-gray-700 hover:bg-gray-200 rounded transition-colors italic">I</button>
            <button class="p-2 text-gray-700 hover:bg-gray-200 rounded transition-colors underline">U</button>
            <div class="w-px h-6 bg-gray-300 mx-1"></div>
            <button class="p-2 text-gray-700 hover:bg-gray-200 rounded transition-colors text-blue-600">🔗</button>
            <button class="p-2 text-gray-700 hover:bg-gray-200 rounded transition-colors text-red-500">📷</button>
          </div>
          <div contenteditable="true" class="min-h-[150px] p-4 bg-white focus:outline-none">
            <p class="text-gray-600">Start typing your content here...</p>
          </div>
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Quick Note (Minimal)</label>
        <div class="flex items-stretch border border-gray-300 rounded-lg overflow-hidden focus-within:ring-2 focus-within:ring-blue-500">
          <div contenteditable="true" class="flex-1 p-3 bg-white focus:outline-none min-h-[80px]" placeholder="Write a note..."></div>
          <div class="flex flex-col border-l border-gray-200">
            <button class="flex-1 px-3 text-gray-500 hover:bg-gray-100 transition-colors">B</button>
            <button class="flex-1 px-3 text-gray-500 hover:bg-gray-100 transition-colors italic">I</button>
            <button class="flex-1 px-3 text-gray-500 hover:bg-gray-100 transition-colors">🔗</button>
          </div>
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Comment Style</label>
        <div class="flex gap-3">
          <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-semibold">JD</div>
          <div class="flex-1">
            <div class="border border-gray-200 rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-blue-500">
              <div contenteditable="true" class="p-3 bg-white focus:outline-none min-h-[60px] text-sm"></div>
              <div class="flex items-center justify-end px-3 py-2 bg-gray-50 border-t border-gray-200">
                <button class="px-4 py-1.5 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 transition-colors">Post</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
