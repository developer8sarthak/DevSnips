<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Bar | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Input — Search Bar</h1>
      <p class="text-gray-600 mt-2">Dedicated search bar components with various styles</p>
    </header>

    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Preview</h2>
      <div class="p-6 bg-white rounded-xl shadow-sm space-y-5 max-w-lg mx-auto">
        <div class="relative">
          <input type="search" placeholder="Search for anything..." class="w-full pl-12 pr-4 py-4 bg-white border border-gray-200 rounded-2xl shadow-sm hover:shadow-md focus:outline-none focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 transition-all" />
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </div>
        </div>

        <div class="relative max-w-sm">
          <input type="search" placeholder="Quick search..." class="w-full pl-10 pr-4 py-2.5 bg-gray-100 border-0 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-colors" />
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </div>
        </div>

        <div class="relative">
          <input type="search" placeholder="Search products, customers..." class="w-full pl-4 pr-24 py-3 bg-white border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" />
          <div class="absolute inset-y-0 right-0 flex items-center">
            <button class="h-full px-4 bg-gray-100 hover:bg-gray-200 text-gray-600 text-sm font-medium rounded-r-xl border-l border-gray-200 transition-colors">Filter</button>
          </div>
        </div>

        <div class="p-4 bg-slate-900 rounded-xl">
          <div class="relative">
            <input type="search" placeholder="Search commands..." class="w-full pl-11 pr-12 py-3.5 bg-slate-800 border border-slate-700 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-slate-700 transition-colors" />
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
              </svg>
            </div>
            <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
              <span class="px-2 py-1 text-xs text-slate-500 bg-slate-700 rounded">⌘K</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-8 p-4 bg-amber-50 rounded-lg border border-amber-200">
      <p class="text-sm text-amber-800"><strong>Patterns:</strong> Command palette style (⌘K), compact inline, and filter-enhanced variants are common in modern apps.</p>
    </div>
  </section>

</body>
</html>
