<!-- Modern SaaS - Clean Card -->
<div class="p-6 bg-white rounded-2xl shadow-sm border border-gray-100">
  <div class="space-y-5">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Workspace Name</label>
      <input type="text" placeholder="My Awesome Workspace" class="w-full px-4 py-3 bg-gray-50/50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all" />
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Project URL</label>
      <div class="flex">
        <span class="inline-flex items-center px-4 rounded-l-xl bg-gray-100 border border-r-0 border-gray-200 text-sm text-gray-500">saas.app/</span>
        <input type="text" placeholder="my-project" class="flex-1 px-4 py-3 bg-gray-50/50 border border-gray-200 rounded-r-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all" />
      </div>
    </div>
  </div>
</div>

<!-- Modern SaaS - Focus Card -->
<div class="p-6 mt-4 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl">
  <h3 class="text-lg font-semibold text-white mb-4">Get Started</h3>
  <div class="space-y-4">
    <input type="email" placeholder="Enter your work email" class="w-full px-4 py-3.5 bg-white/10 backdrop-blur-sm border border-white/20 rounded-xl text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-white/40 focus:bg-white/20 transition-all" />
    <button class="w-full px-4 py-3.5 bg-white text-indigo-600 font-semibold rounded-xl hover:bg-indigo-50 transition-colors">Continue with Email</button>
  </div>
</div>

<!-- Modern SaaS - Stats Input -->
<div class="p-6 mt-4 bg-white rounded-2xl shadow-sm border border-gray-100">
  <h4 class="text-sm font-semibold text-gray-900 mb-4">Monthly Budget</h4>
  <div class="flex items-baseline gap-2">
    <span class="text-4xl font-bold text-gray-900">$</span>
    <input type="number" value="2500" class="text-4xl font-bold text-gray-900 bg-transparent border-0 focus:outline-none w-full" />
  </div>
  <div class="mt-4 pt-4 border-t border-gray-100">
    <div class="flex justify-between text-sm">
      <span class="text-gray-500">Daily limit</span>
      <span class="font-medium text-gray-900">$83.33</span>
    </div>
  </div>
</div>
