<!-- Credit Card - Form Fields -->
<div class="mt-6 p-6 bg-white rounded-xl border border-gray-200 max-w-sm">
  <div class="flex items-center gap-3 mb-6">
    <div class="w-10 h-6 bg-blue-600 rounded"></div>
    <div class="w-10 h-6 bg-red-500 rounded -ml-4"></div>
    <span class="text-sm text-gray-600">Credit / Debit Card</span>
  </div>
  <div class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Card Number</label>
      <div class="relative">
        <input type="text" placeholder="1234 5678 9012 3456" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors tracking-wider" />
        <div class="absolute inset-y-0 right-0 flex items-center pr-3">
          <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
          </svg>
        </div>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Expiration</label>
        <input type="text" placeholder="MM/YY" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">CVV</label>
        <input type="text" placeholder="123" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" />
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Cardholder Name</label>
      <input type="text" placeholder="John Doe" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" />
    </div>
  </div>
</div>
