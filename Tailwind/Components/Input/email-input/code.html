<!-- Email Input - Standard -->
<div>
  <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
  <input type="email" placeholder="you@example.com" class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" />
</div>

<!-- Email Input - With Icon -->
<div class="mt-4">
  <label class="block text-sm font-medium text-gray-700 mb-1">Work Email</label>
  <div class="relative">
    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
      <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
      </svg>
    </div>
    <input type="email" placeholder="name@company.com" class="w-full pl-10 pr-4 py-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-colors" />
  </div>
</div>

<!-- Email Input - Verification -->
<div class="mt-4">
  <label class="block text-sm font-medium text-gray-700 mb-1">Verify Your Email</label>
  <div class="flex gap-3">
    <input type="email" placeholder="Enter verification code" class="flex-1 min-w-0 px-4 py-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" />
    <button class="px-5 py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition-colors shrink-0 whitespace-nowrap">Send Code</button>
  </div>
</div>

<!-- Email Input - Dark -->
<div class="mt-4 p-4 bg-slate-900 rounded-xl">
  <label class="block text-sm font-medium text-gray-300 mb-1">Email Address</label>
  <input type="email" placeholder="you@example.com" class="w-full px-4 py-3 bg-slate-800 border border-slate-600 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-colors" />
</div>
