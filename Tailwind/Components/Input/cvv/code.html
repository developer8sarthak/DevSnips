<!-- CVV - Standard -->
<div>
  <label class="block text-sm font-medium text-gray-700 mb-1">CVV / CVC</label>
  <input type="text" maxlength="4" placeholder="123" class="w-24 px-4 py-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" />
</div>

<!-- CVV - With Help -->
<div class="mt-4">
  <label class="block text-sm font-medium text-gray-700 mb-1">Security Code</label>
  <div class="flex items-center gap-3">
    <input type="text" maxlength="4" placeholder="123" class="w-20 px-4 py-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" />
    <button class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-full transition-colors" title="What's this?">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
    </button>
  </div>
  <p class="mt-2 text-xs text-gray-500">3 digits on back of card (4 for Amex)</p>
</div>

<!-- CVV - Card Visual -->
<div class="mt-4 p-4 bg-gradient-to-br from-slate-700 to-slate-800 rounded-xl">
  <div class="flex items-center justify-between mb-3">
    <span class="text-xs text-gray-400">CVV</span>
    <svg class="w-8 h-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" /></svg>
  </div>
  <input type="text" maxlength="4" placeholder="•••" class="w-full px-4 py-3 bg-slate-900 border border-slate-600 rounded-lg text-white text-center tracking-[0.3em] font-mono text-lg focus:outline-none focus:ring-2 focus:ring-blue-400 transition-colors" />
  <p class="mt-3 text-xs text-gray-500">Enter the 3 or 4 digit code on your card</p>
</div>
