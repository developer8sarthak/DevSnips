<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sharp Corner Input | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Input — Sharp Corner</h1>
      <p class="text-gray-600 mt-2">Sharp rectangular input fields without border radius</p>
    </header>

    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Preview</h2>
      <div class="p-6 bg-white rounded-xl shadow-sm space-y-5 max-w-md">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Reference Code</label>
          <input type="text" placeholder="Enter reference" class="w-full px-4 py-2.5 bg-white border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" />
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">SKU (Dense)</label>
          <input type="text" placeholder="SKU-00000" class="w-full px-3 py-2 bg-gray-50 border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" />
        </div>

        <div class="p-4 bg-slate-800">
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">System ID</label>
            <input type="text" placeholder="SYS-" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition-colors" />
          </div>
        </div>

        <div class="flex items-center gap-3">
          <input type="text" placeholder="Value" class="w-32 px-3 py-2 bg-white border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" />
          <input type="text" placeholder="Label" class="flex-1 px-3 py-2 bg-white border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" />
          <button class="px-4 py-2 bg-gray-900 text-white text-sm hover:bg-gray-800">Update</button>
        </div>
      </div>
    </div>

    <div class="mt-8 p-4 bg-zinc-50 rounded-lg border border-zinc-200">
      <p class="text-sm text-zinc-800"><strong>Use Case:</strong> Sharp-cornered inputs work well in data-dense UIs, tables, and industrial/corporate applications.</p>
    </div>
  </section>

</body>
</html>
