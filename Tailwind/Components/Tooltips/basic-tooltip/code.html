<!--
Snippet Name: Basic Tooltip
Description: Top-positioned tooltip with arrow that appears on hover and keyboard focus. Pure CSS via data-tooltip attribute.
Author: DevSnips Contributors
Usage Example: Add data-tooltip="text" to any focusable element. No JavaScript required.
-->
<button
  type="button"
  class="tooltip inline-flex items-center gap-2 rounded-lg bg-gray-900 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-gray-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2"
  data-tooltip="Copy to clipboard"
  aria-describedby="tt-basic"
>
  <span>Hover me</span>
</button>
<span id="tt-basic" role="tooltip" class="sr-only">Copy to clipboard</span>

<style>
  .tooltip {
    position: relative;
  }
  .tooltip::after {
    content: attr(data-tooltip);
    position: absolute;
    left: 50%;
    bottom: calc(100% + 10px);
    transform: translateX(-50%) translateY(4px);
    padding: 6px 10px;
    border-radius: 8px;
    background: #111827;
    color: #fff;
    font-size: 12.5px;
    font-weight: 500;
    line-height: 1.3;
    white-space: nowrap;
    opacity: 0;
    visibility: hidden;
    transition: opacity .15s ease, transform .15s ease, visibility .15s;
    pointer-events: none;
    z-index: 50;
  }
  .tooltip::before {
    content: '';
    position: absolute;
    left: 50%;
    bottom: calc(100% + 4px);
    transform: translateX(-50%) translateY(4px);
    border: 6px solid transparent;
    border-top-color: #111827;
    opacity: 0;
    visibility: hidden;
    transition: opacity .15s ease, transform .15s ease, visibility .15s;
    pointer-events: none;
    z-index: 50;
  }
  .tooltip:hover::after,
  .tooltip:focus-visible::after {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
  }
  .tooltip:hover::before,
  .tooltip:focus-visible::before {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
  }
</style>
