<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button - Basic | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  
  <!-- Component: Button / Basic -->
  <!-- Variants: Primary, Secondary, Neutral, Accent -->

  <section class="max-w-4xl mx-auto space-y-12">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Button — Basic</h1>
      <p class="text-gray-600 mt-2">Foundation button styles with semantic color variants</p>
    </header>

    <!-- Primary Buttons -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Primary</h2>
      <div class="flex flex-wrap gap-4 p-6 bg-white rounded-xl shadow-sm">
        <button class="px-6 py-2.5 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
          Default
        </button>
        <button class="px-6 py-2.5 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors" disabled>
          Disabled
        </button>
        <a href="#" class="px-6 py-2.5 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors text-center">
          Link Button
        </a>
      </div>
    </div>

    <!-- Secondary Buttons -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Secondary</h2>
      <div class="flex flex-wrap gap-4 p-6 bg-white rounded-xl shadow-sm">
        <button class="px-6 py-2.5 bg-gray-200 text-gray-900 font-medium rounded-lg hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 transition-colors">
          Default
        </button>
        <button class="px-6 py-2.5 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-colors">
          Indigo
        </button>
        <button class="px-6 py-2.5 bg-violet-600 text-white font-medium rounded-lg hover:bg-violet-700 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:ring-offset-2 transition-colors">
          Violet
        </button>
      </div>
    </div>

    <!-- Neutral Buttons -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Neutral</h2>
      <div class="flex flex-wrap gap-4 p-6 bg-gray-900 rounded-xl">
        <button class="px-6 py-2.5 bg-white text-gray-900 font-medium rounded-lg hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 focus:ring-offset-gray-900 transition-colors">
          Light on Dark
        </button>
        <button class="px-6 py-2.5 bg-gray-800 text-white font-medium rounded-lg hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-600 focus:ring-offset-2 focus:ring-offset-gray-900 transition-colors">
          Dark
        </button>
      </div>
    </div>

    <!-- Sizes -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Sizes</h2>
      <div class="flex flex-wrap items-center gap-4 p-6 bg-white rounded-xl shadow-sm">
        <button class="px-3 py-1.5 bg-blue-600 text-white text-xs font-medium rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
          Small
        </button>
        <button class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
          Default
        </button>
        <button class="px-6 py-3 bg-blue-600 text-white text-base font-medium rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
          Large
        </button>
        <button class="px-8 py-4 bg-blue-600 text-white text-lg font-semibold rounded-xl hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
          Extra Large
        </button>
      </div>
    </div>

    <!-- Full Width -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Full Width</h2>
      <div class="p-6 bg-white rounded-xl shadow-sm space-y-3">
        <button class="w-full px-6 py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
          Full Width Button
        </button>
        <div class="grid grid-cols-2 gap-3">
          <button class="px-6 py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
            Split Left
          </button>
          <button class="px-6 py-3 bg-gray-200 text-gray-900 font-medium rounded-lg hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 transition-colors">
            Split Right
          </button>
        </div>
      </div>
    </div>

  </section>

</body>
</html>
