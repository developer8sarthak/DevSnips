<!-- 3D Button Styles -->
<style>
  .btn-3d {
    position: relative;
    box-shadow: 0 6px 0 #1d4ed8;
    transition: all 0.1s;
  }
  .btn-3d:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #1d4ed8;
  }
</style>

<!-- 3D Blue Button -->
<button class="px-8 py-3 btn-3d bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
  3D Blue
</button>

<!-- 3D Gray Button -->
<button class="px-8 py-3 bg-gray-600 text-white font-bold rounded-lg hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-500" style="box-shadow: 0 6px 0 #374151; transition: all 0.1s;" onclick="this.style.transform='translateY(4px)';this.style.boxShadow='0 2px 0 #374151';setTimeout(()=>{this.style.transform='';this.style.boxShadow='0 6px 0 #374151';},100)">
  3D Gray
</button>

<!-- 3D Green Button -->
<button class="px-8 py-3 bg-green-500 text-white font-bold rounded-lg hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-400" style="box-shadow: 0 6px 0 #15803d; transition: all 0.1s;" onclick="this.style.transform='translateY(4px)';this.style.boxShadow='0 2px 0 #15803d';setTimeout(()=>{this.style.transform='';this.style.boxShadow='0 6px 0 #15803d';},100)">
  3D Green
</button>
