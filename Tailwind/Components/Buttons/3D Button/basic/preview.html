<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Button Basic | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .btn-3d {
      position: relative;
      box-shadow: 0 6px 0 #1d4ed8;
      transition: all 0.1s;
    }
    .btn-3d:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #1d4ed8;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-8">
  
  <!-- Component: Button / 3D / Basic -->
  
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Button — 3D — Basic</h1>
      <p class="text-gray-600 mt-2">3D push button effects</p>
    </header>

    <!-- Preview -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Preview</h2>
      <div class="flex flex-wrap gap-6 p-6 bg-white rounded-xl shadow-sm">
        <button class="px-8 py-3 btn-3d bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
          3D Blue
        </button>
        <button class="px-8 py-3 btn-3d bg-gray-600 text-white font-bold rounded-lg hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-500" style="box-shadow: 0 6px 0 #374151;">
          3D Gray
        </button>
        <button class="px-8 py-3 btn-3d bg-green-500 text-white font-bold rounded-lg hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-400" style="box-shadow: 0 6px 0 #15803d;">
          3D Green
        </button>
      </div>
    </div>

  </section>

</body>
</html>
