<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button - Split | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .dropdown {
      position: relative;
      display: inline-block;
    }
    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      z-index: 50;
      min-width: 100%;
      padding: 0.5rem 0;
      margin-top: 0.25rem;
      background: white;
      border-radius: 0.5rem;
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    }
    .dropdown:hover .dropdown-menu,
    .dropdown-menu:hover {
      display: block;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  
  <!-- Component: Button / Split -->
  <!-- Variants: Dropdown Split, Icon Split, Search Split -->

  <section class="max-w-4xl mx-auto space-y-12">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Button — Split</h1>
      <p class="text-gray-600 mt-2">Button with dropdown or secondary action</p>
    </header>

    <!-- Dropdown Split -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Dropdown Split</h2>
      <div class="flex flex-wrap gap-6 p-6 bg-white rounded-xl shadow-sm">
        <!-- Primary Split -->
        <div class="dropdown">
          <button class="inline-flex items-center px-4 py-2 bg-blue-600 text-white font-medium rounded-l-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
            <span>Action</span>
          </button>
          <button class="inline-flex items-center px-2 py-2 bg-blue-700 text-white rounded-r-lg hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>
          <div class="dropdown-menu">
            <a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Option 1</a>
            <a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Option 2</a>
            <a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Option 3</a>
          </div>
        </div>

        <!-- Secondary Split -->
        <div class="dropdown">
          <button class="inline-flex items-center px-4 py-2 border border-gray-300 text-gray-700 font-medium rounded-l-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 transition-colors">
            <span>Export</span>
          </button>
          <button class="inline-flex items-center px-2 py-2 border border-l-0 border-gray-300 text-gray-600 rounded-r-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>
          <div class="dropdown-menu">
            <a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">
              <span class="flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
                </svg>
                PDF
              </span>
            </a>
            <a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">
              <span class="flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                Word
              </span>
            </a>
          </div>
        </div>

        <!-- Ghost Split -->
        <div class="dropdown">
          <button class="inline-flex items-center px-4 py-2 text-gray-700 font-medium rounded-l-lg hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-500 transition-colors">
            <span>More</span>
          </button>
          <button class="inline-flex items-center px-2 py-2 text-gray-600 rounded-r-lg hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-500 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>
          <div class="dropdown-menu">
            <a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Edit</a>
            <a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Duplicate</a>
            <hr class="my-1 border-gray-200">
            <a href="#" class="block px-4 py-2 text-red-600 hover:bg-red-50">Delete</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Icon Split -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Icon Split</h2>
      <div class="flex flex-wrap gap-6 p-6 bg-white rounded-xl shadow-sm">
        <!-- Upload Split -->
        <div class="dropdown">
          <button class="inline-flex items-center gap-2 px-4 py-2 bg-green-600 text-white font-medium rounded-l-lg hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
            </svg>
            Upload
          </button>
          <button class="inline-flex items-center px-2 py-2 bg-green-700 text-white rounded-r-lg hover:bg-green-800 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>
          <div class="dropdown-menu">
            <a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">
              <span class="flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
                </svg>
                Files
              </span>
            </a>
            <a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">
              <span class="flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
                Photos
              </span>
            </a>
          </div>
        </div>

        <!-- Edit Split -->
        <div class="dropdown">
          <button class="inline-flex items-center gap-2 px-4 py-2 bg-amber-500 text-white font-medium rounded-l-lg hover:bg-amber-600 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:ring-offset-2 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
            </svg>
            Edit
          </button>
          <button class="inline-flex items-center px-2 py-2 bg-amber-600 text-white rounded-r-lg hover:bg-amber-700 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:ring-offset-2 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>
          <div class="dropdown-menu">
            <a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Quick Edit</a>
            <a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Full Editor</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Search Split -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Search Split</h2>
      <div class="flex flex-wrap gap-4 p-6 bg-white rounded-xl shadow-sm">
        <!-- Dropdown Search -->
        <div class="dropdown">
          <button class="inline-flex items-center px-4 py-2 bg-gray-100 text-gray-700 font-medium border border-r-0 border-gray-300 rounded-l-lg hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-gray-500 transition-colors">
            <span>All</span>
            <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>
          <input type="text" placeholder="Search..." class="px-4 py-2 border border-gray-300 rounded-r-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 w-64">
          <div class="dropdown-menu -ml-px">
            <a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">All Categories</a>
            <a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Documents</a>
            <a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Images</a>
            <a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Videos</a>
          </div>
        </div>

        <!-- Button with Search -->
        <div class="flex">
          <button class="px-4 py-2 bg-blue-600 text-white font-medium rounded-l-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
          </button>
          <input type="text" placeholder="Quick search..." class="px-4 py-2 border border-blue-300 rounded-r-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 w-56">
        </div>
      </div>
    </div>

    <!-- Sizes -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Split Sizes</h2>
      <div class="flex flex-wrap items-center gap-6 p-6 bg-white rounded-xl shadow-sm">
        <!-- Small -->
        <div class="dropdown">
          <button class="inline-flex items-center px-3 py-1.5 bg-blue-600 text-white text-sm font-medium rounded-l-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors">
            <span>Small</span>
          </button>
          <button class="inline-flex items-center px-1.5 py-1.5 bg-blue-700 text-white rounded-r-lg hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>
          <div class="dropdown-menu">
            <a href="#" class="block px-3 py-1.5 text-sm text-gray-700 hover:bg-gray-100">Option</a>
          </div>
        </div>

        <!-- Default -->
        <div class="dropdown">
          <button class="inline-flex items-center px-4 py-2 bg-blue-600 text-white font-medium rounded-l-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors">
            <span>Default</span>
          </button>
          <button class="inline-flex items-center px-2 py-2 bg-blue-700 text-white rounded-r-lg hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>
          <div class="dropdown-menu">
            <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Option</a>
          </div>
        </div>

        <!-- Large -->
        <div class="dropdown">
          <button class="inline-flex items-center px-6 py-3 bg-blue-600 text-white text-base font-medium rounded-l-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors">
            <span>Large</span>
          </button>
          <button class="inline-flex items-center px-3 py-3 bg-blue-700 text-white rounded-r-lg hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>
          <div class="dropdown-menu">
            <a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Option</a>
          </div>
        </div>
      </div>
    </div>

  </section>

</body>
</html>
