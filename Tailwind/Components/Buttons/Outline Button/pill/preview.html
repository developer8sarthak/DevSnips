<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outline Pill Button | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  
  <!-- Component: Button / Outline / Pill -->
  
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Button — Outline — Pill</h1>
      <p class="text-gray-600 mt-2">Fully rounded pill-shaped outline buttons</p>
    </header>

    <!-- Preview -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Preview</h2>
      <div class="flex flex-wrap gap-4 p-6 bg-white rounded-xl shadow-sm">
        <button class="px-6 py-2.5 border-2 border-blue-600 text-blue-600 font-medium rounded-full hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors">
          Pill Shape
        </button>
        <button class="px-6 py-2.5 border-2 border-pink-500 text-pink-500 font-medium rounded-full hover:bg-pink-50 focus:outline-none focus:ring-2 focus:ring-pink-500 transition-colors">
          Pink Pill
        </button>
        <button class="px-6 py-2.5 border-2 border-green-500 text-green-600 font-medium rounded-full hover:bg-green-50 focus:outline-none focus:ring-2 focus:ring-green-600 transition-colors">
          Green Pill
        </button>
      </div>
    </div>

  </section>

</body>
</html>
