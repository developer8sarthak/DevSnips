<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outline on Dark Button | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  
  <!-- Component: Button / Outline / Dark -->
  
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Button — Outline — Dark Background</h1>
      <p class="text-gray-600 mt-2">Outline buttons designed for dark backgrounds</p>
    </header>

    <!-- Preview -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">On Dark Background</h2>
      <div class="flex flex-wrap gap-4 p-6 bg-gray-900 rounded-xl">
        <button class="px-6 py-2.5 border-2 border-white text-white font-medium rounded-lg hover:bg-white hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-white transition-colors">
          White Outline
        </button>
        <button class="px-6 py-2.5 border-2 border-blue-400 text-blue-400 font-medium rounded-lg hover:bg-blue-400 hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-colors">
          Blue Outline
        </button>
        <button class="px-6 py-2.5 border-2 border-gray-600 text-gray-300 font-medium rounded-lg hover:border-gray-400 hover:text-white focus:outline-none focus:ring-2 focus:ring-gray-500 transition-colors">
          Muted Outline
        </button>
      </div>
    </div>

  </section>

</body>
</html>
