<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghost Dark Button | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  
  <!-- Component: Button / Ghost / Dark -->
  
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Button — Ghost — Dark</h1>
      <p class="text-gray-600 mt-2">Ghost buttons designed for dark backgrounds</p>
    </header>

    <!-- Preview -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">On Dark Background</h2>
      <div class="flex flex-wrap gap-4 p-6 bg-gray-900 rounded-xl">
        <button class="px-6 py-2.5 text-white font-medium rounded-lg hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-white/50 transition-colors">
          White Ghost
        </button>
        <button class="px-6 py-2.5 text-gray-300 font-medium rounded-lg hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-white/50 transition-colors">
          Gray Ghost
        </button>
        <button class="px-6 py-2.5 text-blue-400 font-medium rounded-lg hover:bg-blue-400/10 focus:outline-none focus:ring-2 focus:ring-blue-400/50 transition-colors">
          Blue Ghost
        </button>
      </div>
    </div>

  </section>

</body>
</html>
