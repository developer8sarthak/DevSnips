<!-- Neumorphism Pressed Button Styles -->
<style>
  .neu-pressed {
    background: #e0e5ec;
    box-shadow: inset 6px 6px 12px #b8bec5, inset -6px -6px 12px #ffffff;
  }
  .neu-pressed:hover {
    box-shadow: inset 4px 4px 8px #b8bec5, inset -4px -4px 8px #ffffff;
  }
</style>

<!-- Neumorphism Pressed Button - Default -->
<button class="px-8 py-3 neu-pressed text-gray-600 font-semibold rounded-xl focus:outline-none focus:ring-2 focus:ring-gray-400 transition-all">
  Pressed Effect
</button>

<!-- Neumorphism Pressed Button - Pill -->
<button class="px-8 py-3 neu-pressed text-gray-600 font-semibold rounded-full focus:outline-none focus:ring-2 focus:ring-gray-400 transition-all">
  Pressed Pill
</button>

<!-- Neumorphism Pressed Button - Disabled -->
<button class="px-8 py-3 neu-pressed text-gray-600 font-semibold rounded-xl focus:outline-none focus:ring-2 focus:ring-gray-400 transition-all" disabled>
  Pressed Disabled
</button>
