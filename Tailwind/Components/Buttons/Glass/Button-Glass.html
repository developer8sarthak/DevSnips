<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button - Glass | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .glass {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .glass-dark {
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glass-strong {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body class="min-h-screen p-8" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
  
  <!-- Component: Button / Glass -->
  <!-- Variants: Glass, Glass Dark, Glass Strong, Glass with Glow -->

  <section class="max-w-4xl mx-auto space-y-12">
    <header class="border-b border-white/20 pb-4">
      <h1 class="text-3xl font-bold text-white">Button — Glass</h1>
      <p class="text-white/70 mt-2">Frosted glass effect buttons with backdrop blur</p>
    </header>

    <!-- Glass Light -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-white">Glass on Gradient</h2>
      <div class="flex flex-wrap gap-4 p-6 rounded-xl" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
        <button class="glass px-6 py-2.5 text-white font-medium rounded-lg hover:bg-white/20 focus:outline-none focus:ring-2 focus:ring-white/50 transition-all">
          Glass Default
        </button>
        <button class="glass px-6 py-2.5 text-white font-medium rounded-lg hover:bg-white/20 focus:outline-none focus:ring-2 focus:ring-white/50 transition-all" disabled>
          Glass Disabled
        </button>
        <button class="glass-strong px-6 py-2.5 text-white font-semibold rounded-lg hover:bg-white/25 focus:outline-none focus:ring-2 focus:ring-white/50 transition-all">
          Glass Strong
        </button>
      </div>
    </div>

    <!-- Glass Colors -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-white">Glass Colors</h2>
      <div class="flex flex-wrap gap-4 p-6 rounded-xl" style="background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);">
        <button class="glass px-6 py-2.5 text-white font-medium rounded-lg hover:bg-white/20 focus:outline-none focus:ring-2 focus:ring-white/50 transition-all">
          Default Glass
        </button>
        <button class="glass px-6 py-2.5 text-green-200 font-medium rounded-lg hover:bg-green-400/30 focus:outline-none focus:ring-2 focus:ring-green-300/50 transition-all">
          Green Glass
        </button>
        <button class="glass px-6 py-2.5 text-blue-200 font-medium rounded-lg hover:bg-blue-400/30 focus:outline-none focus:ring-2 focus:ring-blue-300/50 transition-all">
          Blue Glass
        </button>
      </div>
    </div>

    <!-- Glass Dark Background -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-white">Glass on Dark</h2>
      <div class="flex flex-wrap gap-4 p-6 bg-gray-900 rounded-xl">
        <button class="glass-dark px-6 py-2.5 text-white font-medium rounded-lg hover:bg-white/20 focus:outline-none focus:ring-2 focus:ring-white/50 transition-all">
          Dark Glass
        </button>
        <button class="glass-dark px-6 py-2.5 text-white font-medium rounded-lg hover:bg-white/20 focus:outline-none focus:ring-2 focus:ring-white/50 transition-all border border-blue-500/30">
          Blue Border Glass
        </button>
        <button class="glass-dark px-6 py-2.5 text-purple-300 font-medium rounded-lg hover:bg-purple-500/30 focus:outline-none focus:ring-2 focus:ring-purple-300/50 transition-all border border-purple-400/30">
          Purple Glass
        </button>
      </div>
    </div>

    <!-- Glass with Glow -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-white">Glass with Glow</h2>
      <div class="flex flex-wrap gap-4 p-6 rounded-xl" style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);">
        <button class="glass px-6 py-2.5 text-white font-medium rounded-lg hover:bg-white/20 focus:outline-none focus:ring-2 focus:ring-white/50 transition-all shadow-lg shadow-blue-500/25">
          Glow Glass
        </button>
        <button class="glass px-6 py-2.5 text-cyan-300 font-medium rounded-lg hover:bg-cyan-500/20 focus:outline-none focus:ring-2 focus:ring-cyan-300/50 transition-all shadow-lg shadow-cyan-500/25">
          Cyan Glow
        </button>
        <button class="glass px-6 py-2.5 text-pink-300 font-medium rounded-lg hover:bg-pink-500/20 focus:outline-none focus:ring-2 focus:ring-pink-300/50 transition-all shadow-lg shadow-pink-500/25">
          Pink Glow
        </button>
      </div>
    </div>

    <!-- Glass Sizes -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-white">Glass Sizes</h2>
      <div class="flex flex-wrap items-center gap-4 p-6 rounded-xl" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
        <button class="glass px-3 py-1.5 text-white text-xs font-medium rounded-md hover:bg-white/20 focus:outline-none focus:ring-2 focus:ring-white/50 transition-all">
          Small
        </button>
        <button class="glass px-4 py-2 text-white text-sm font-medium rounded-lg hover:bg-white/20 focus:outline-none focus:ring-2 focus:ring-white/50 transition-all">
          Default
        </button>
        <button class="glass px-6 py-3 text-white text-base font-medium rounded-lg hover:bg-white/20 focus:outline-none focus:ring-2 focus:ring-white/50 transition-all">
          Large
        </button>
      </div>
    </div>

    <!-- Glass Icon Buttons -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-white">Glass Icon Buttons</h2>
      <div class="flex flex-wrap gap-4 p-6 rounded-xl" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
        <button class="glass p-2.5 text-white rounded-lg hover:bg-white/20 focus:outline-none focus:ring-2 focus:ring-white/50 transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
          </svg>
        </button>
        <button class="glass p-2.5 text-white rounded-lg hover:bg-white/20 focus:outline-none focus:ring-2 focus:ring-white/50 transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
          </svg>
        </button>
        <button class="glass p-2.5 text-white rounded-lg hover:bg-white/20 focus:outline-none focus:ring-2 focus:ring-white/50 transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>
          </svg>
        </button>
      </div>
    </div>

  </section>

</body>
</html>
