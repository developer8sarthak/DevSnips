<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradient Pill Button | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  
  <!-- Component: Button / Gradient / Pill -->
  
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Button — Gradient — Pill</h1>
      <p class="text-gray-600 mt-2">Fully rounded gradient buttons with pill shape</p>
    </header>

    <!-- Preview -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Preview</h2>
      <div class="flex flex-wrap gap-4 p-6 bg-white rounded-xl shadow-sm">
        <button class="px-6 py-2.5 bg-gradient-to-r from-violet-500 to-purple-500 text-white font-medium rounded-full hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-violet-500 transition-opacity">
          Violet Pill
        </button>
        <button class="px-6 py-2.5 bg-gradient-to-r from-cyan-400 to-blue-500 text-white font-medium rounded-full hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-opacity">
          Cyan Pill
        </button>
        <button class="px-6 py-2.5 bg-gradient-to-r from-emerald-400 to-teal-500 text-white font-medium rounded-full hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-opacity">
          Emerald Pill
        </button>
      </div>
    </div>

    <!-- Sizes -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Sizes</h2>
      <div class="flex flex-wrap items-center gap-4 p-6 bg-white rounded-xl shadow-sm">
        <button class="px-4 py-1.5 bg-gradient-to-r from-blue-500 to-purple-500 text-white text-xs font-medium rounded-full hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-purple-500 transition-opacity">
          Small
        </button>
        <button class="px-6 py-2.5 bg-gradient-to-r from-blue-500 to-purple-500 text-white text-sm font-medium rounded-full hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-purple-500 transition-opacity">
          Default
        </button>
        <button class="px-8 py-3 bg-gradient-to-r from-blue-500 to-purple-500 text-white text-base font-medium rounded-full hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-purple-500 transition-opacity">
          Large
        </button>
      </div>
    </div>

  </section>

</body>
</html>
