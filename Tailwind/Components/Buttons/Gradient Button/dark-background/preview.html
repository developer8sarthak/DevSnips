<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradient on Dark Button | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  
  <!-- Component: Button / Gradient / Dark Background -->
  
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Button — Gradient — Dark Background</h1>
      <p class="text-gray-600 mt-2">Gradient buttons designed for dark backgrounds</p>
    </header>

    <!-- Preview on Dark -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">On Dark Background</h2>
      <div class="flex flex-wrap gap-4 p-6 bg-gray-900 rounded-xl">
        <button class="px-6 py-2.5 bg-gradient-to-r from-blue-400 to-cyan-400 text-gray-900 font-medium rounded-lg hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:ring-offset-2 focus:ring-offset-gray-900 transition-opacity">
          Light Gradient
        </button>
        <button class="px-6 py-2.5 bg-gradient-to-r from-purple-400 to-pink-400 text-white font-medium rounded-lg hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-pink-400 focus:ring-offset-2 focus:ring-offset-gray-900 transition-opacity">
          Bright Gradient
        </button>
      </div>
    </div>

    <!-- On Purple Background -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">On Purple Background</h2>
      <div class="flex flex-wrap gap-4 p-6 bg-gradient-to-br from-purple-900 to-indigo-900 rounded-xl">
        <button class="px-6 py-2.5 bg-gradient-to-r from-cyan-300 to-blue-300 text-gray-900 font-medium rounded-lg hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-cyan-300 focus:ring-offset-2 focus:ring-offset-indigo-900 transition-opacity">
          Cyan Glow
        </button>
        <button class="px-6 py-2.5 bg-gradient-to-r from-yellow-300 to-orange-400 text-gray-900 font-medium rounded-lg hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:ring-offset-2 focus:ring-offset-indigo-900 transition-opacity">
          Warm Glow
        </button>
      </div>
    </div>

  </section>

</body>
</html>
