<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button - Floating | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .float-shadow {
      box-shadow: 0 4px 14px 0 rgba(0, 0, 0, 0.25);
    }
    .float-shadow-lg {
      box-shadow: 0 10px 25px 0 rgba(0, 0, 0, 0.3);
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .animate-float {
      animation: float 3s ease-in-out infinite;
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
      70% { box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); }
      100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
    }
    .animate-pulse-ring {
      animation: pulse-ring 2s infinite;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-8">
  
  <!-- Component: Button / Floating -->
  <!-- Variants: FAB, FAB Extended, FAB Speed Dial, Floating Action -->

  <section class="max-w-4xl mx-auto space-y-12">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Button — Floating</h1>
      <p class="text-gray-600 mt-2">Floating action buttons (FAB) and floating UI</p>
    </header>

    <!-- Basic FAB -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Floating Action Buttons</h2>
      <div class="relative h-48 bg-gradient-to-br from-blue-50 to-indigo-100 rounded-xl overflow-hidden">
        <!-- Bottom Right FAB -->
        <button class="absolute bottom-6 right-6 p-4 bg-blue-600 text-white rounded-full hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 float-shadow transition-all" aria-label="Add new">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
          </svg>
        </button>
        
        <!-- Secondary FAB -->
        <button class="absolute bottom-6 right-24 p-3 bg-white text-gray-600 rounded-full hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-400 float-shadow transition-all" aria-label="Upload">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- FAB Variants -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">FAB Variants</h2>
      <div class="flex flex-wrap items-end gap-4 p-6 bg-white rounded-xl shadow-sm">
        <!-- Primary FAB -->
        <button class="p-4 bg-blue-600 text-white rounded-full hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 float-shadow transition-all" aria-label="Add">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
          </svg>
        </button>

        <!-- Secondary FAB -->
        <button class="p-4 bg-gray-100 text-gray-700 rounded-full hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-gray-400 float-shadow transition-all" aria-label="Edit">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
          </svg>
        </button>

        <!-- Danger FAB -->
        <button class="p-4 bg-red-500 text-white rounded-full hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-400 float-shadow transition-all" aria-label="Delete">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
        </button>

        <!-- Outline FAB -->
        <button class="p-4 border-2 border-blue-600 text-blue-600 rounded-full hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-500 float-shadow transition-all" aria-label="Share">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>
          </svg>
        </button>

        <!-- Ghost FAB -->
        <button class="p-4 text-gray-500 rounded-full hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-400 transition-all" aria-label="More">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h.01M12 12h.01M19 12h.01M6 12a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- FAB Sizes -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">FAB Sizes</h2>
      <div class="flex flex-wrap items-center gap-4 p-6 bg-white rounded-xl shadow-sm">
        <button class="p-2 bg-blue-600 text-white rounded-full hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 float-shadow transition-all" aria-label="Small">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
          </svg>
        </button>

        <button class="p-3 bg-blue-600 text-white rounded-full hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 float-shadow transition-all" aria-label="Medium">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
          </svg>
        </button>

        <button class="p-4 bg-blue-600 text-white rounded-full hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 float-shadow transition-all" aria-label="Large">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
          </svg>
        </button>

        <button class="p-5 bg-blue-600 text-white rounded-full hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 float-shadow-lg transition-all" aria-label="Extra Large">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Extended FAB -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Extended FAB</h2>
      <div class="flex flex-wrap gap-4 p-6 bg-white rounded-xl shadow-sm">
        <button class="inline-flex items-center gap-3 px-5 py-3 bg-blue-600 text-white font-medium rounded-2xl hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 float-shadow transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
          </svg>
          Create
        </button>

        <button class="inline-flex items-center gap-3 px-5 py-3 border-2 border-blue-600 text-blue-600 font-medium rounded-2xl hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-500 float-shadow transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
          </svg>
          Upload File
        </button>

        <button class="inline-flex items-center gap-3 px-5 py-3 bg-gray-800 text-white font-medium rounded-2xl hover:bg-gray-900 focus:outline-none focus:ring-2 focus:ring-gray-500 float-shadow transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>
          </svg>
          Share
        </button>
      </div>
    </div>

    <!-- Animated FAB -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Animated FAB</h2>
      <div class="flex flex-wrap items-end gap-4 p-6 bg-gradient-to-br from-purple-100 to-pink-100 rounded-xl">
        <!-- Pulse FAB -->
        <button class="p-4 bg-blue-600 text-white rounded-full hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 float-shadow transition-all animate-pulse-ring" aria-label="Pulse">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
          </svg>
        </button>

        <!-- Float Animation FAB -->
        <button class="p-4 bg-green-500 text-white rounded-full hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-400 float-shadow transition-all animate-float" aria-label="Float">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11.5V14m0-2.5v-6a1.5 1.5 0 113 0m-3 6a1.5 1.5 0 00-3 0v2a7.5 7.5 0 0015 0v-5a1.5 1.5 0 00-3 0m-6-3V11m0-5.5v-1a1.5 1.5 0 013 0v1m0 0V11m0-5.5a1.5 1.5 0 013 0v3m0 0V11"/>
          </svg>
        </button>

        <!-- Rotate FAB -->
        <button class="p-4 bg-purple-600 text-white rounded-full hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500 float-shadow transition-all hover:rotate-45" aria-label="Rotate">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- FAB Speed Dial -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">FAB Speed Dial</h2>
      <div class="relative h-64 bg-gradient-to-br from-indigo-50 to-purple-100 rounded-xl overflow-hidden p-6">
        <div class="absolute bottom-6 right-6 space-y-3">
          <!-- Labels (appear on hover) -->
          <div class="flex items-center justify-end gap-3 opacity-0 group-hover:opacity-100 transition-opacity">
            <span class="px-3 py-1 bg-gray-800 text-white text-sm rounded-md">Upload</span>
            <button class="p-3 bg-white text-gray-600 rounded-full hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-400 float-shadow transition-all" aria-label="Upload">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
              </svg>
            </button>
          </div>
          
          <div class="flex items-center justify-end gap-3 opacity-0 group-hover:opacity-100 transition-opacity">
            <span class="px-3 py-1 bg-gray-800 text-white text-sm rounded-md">Share</span>
            <button class="p-3 bg-white text-gray-600 rounded-full hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-400 float-shadow transition-all" aria-label="Share">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>
              </svg>
            </button>
          </div>
          
          <div class="flex items-center justify-end gap-3 opacity-0 group-hover:opacity-100 transition-opacity">
            <span class="px-3 py-1 bg-gray-800 text-white text-sm rounded-md">Bookmark</span>
            <button class="p-3 bg-white text-gray-600 rounded-full hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-400 float-shadow transition-all" aria-label="Bookmark">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
              </svg>
            </button>
          </div>

          <!-- Main FAB -->
          <button class="p-4 bg-blue-600 text-white rounded-full hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 float-shadow-lg transition-all group-hover:rotate-45" aria-label="More options">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

  </section>

</body>
</html>
