<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button - Outline | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  
  <!-- Component: Button / Outline -->
  <!-- Variants: Standard outline, Rounded, Thick border, Dashed -->

  <section class="max-w-4xl mx-auto space-y-12">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Button — Outline</h1>
      <p class="text-gray-600 mt-2">Bordered buttons with transparent backgrounds</p>
    </header>

    <!-- Outline Primary -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Outline Primary</h2>
      <div class="flex flex-wrap gap-4 p-6 bg-white rounded-xl shadow-sm">
        <button class="px-6 py-2.5 border-2 border-blue-600 text-blue-600 font-medium rounded-lg hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
          Default
        </button>
        <button class="px-6 py-2.5 border-2 border-blue-600 text-blue-600 font-medium rounded-lg hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors" disabled>
          Disabled
        </button>
      </div>
    </div>

    <!-- Outline Colors -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Outline Colors</h2>
      <div class="flex flex-wrap gap-4 p-6 bg-white rounded-xl shadow-sm">
        <button class="px-6 py-2.5 border-2 border-red-500 text-red-500 font-medium rounded-lg hover:bg-red-50 focus:outline-none focus:ring-2 focus:ring-red-500 transition-colors">
          Red
        </button>
        <button class="px-6 py-2.5 border-2 border-green-600 text-green-600 font-medium rounded-lg hover:bg-green-50 focus:outline-none focus:ring-2 focus:ring-green-600 transition-colors">
          Green
        </button>
        <button class="px-6 py-2.5 border-2 border-amber-500 text-amber-500 font-medium rounded-lg hover:bg-amber-50 focus:outline-none focus:ring-2 focus:ring-amber-500 transition-colors">
          Amber
        </button>
        <button class="px-6 py-2.5 border-2 border-purple-600 text-purple-600 font-medium rounded-lg hover:bg-purple-50 focus:outline-none focus:ring-2 focus:ring-purple-600 transition-colors">
          Purple
        </button>
        <button class="px-6 py-2.5 border-2 border-gray-800 text-gray-800 font-medium rounded-lg hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-800 transition-colors">
          Dark
        </button>
      </div>
    </div>

    <!-- Thick Border -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Thick Border</h2>
      <div class="flex flex-wrap gap-4 p-6 bg-white rounded-xl shadow-sm">
        <button class="px-6 py-3 border-[3px] border-blue-600 text-blue-600 font-semibold rounded-lg hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors">
          Thick Outline
        </button>
        <button class="px-6 py-3 border-[3px] border-gray-900 text-gray-900 font-semibold rounded-lg hover:bg-gray-900 hover:text-white focus:outline-none focus:ring-2 focus:ring-gray-900 transition-colors">
          Invert on Hover
        </button>
        <button class="px-6 py-3 border-[3px] border-transparent border-t-gray-900 border-l-gray-900 text-gray-900 font-semibold rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-900 transition-colors">
          Offset Border
        </button>
      </div>
    </div>

    <!-- Dashed Border -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Dashed Border</h2>
      <div class="flex flex-wrap gap-4 p-6 bg-white rounded-xl shadow-sm">
        <button class="px-6 py-3 border-2 border-dashed border-gray-400 text-gray-600 font-medium rounded-lg hover:border-gray-600 hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-gray-500 transition-colors">
          Dashed Outline
        </button>
        <button class="px-6 py-3 border-2 border-dashed border-blue-400 text-blue-600 font-medium rounded-lg hover:border-blue-600 hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors">
          Dashed Blue
        </button>
      </div>
    </div>

    <!-- Rounded Pill -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Rounded Pill</h2>
      <div class="flex flex-wrap gap-4 p-6 bg-white rounded-xl shadow-sm">
        <button class="px-6 py-2.5 border-2 border-blue-600 text-blue-600 font-medium rounded-full hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors">
          Pill Shape
        </button>
        <button class="px-6 py-2.5 border-2 border-pink-500 text-pink-500 font-medium rounded-full hover:bg-pink-50 focus:outline-none focus:ring-2 focus:ring-pink-500 transition-colors">
          Pink Pill
        </button>
        <button class="px-6 py-2.5 border-2 border-green-500 text-green-600 font-medium rounded-full hover:bg-green-50 focus:outline-none focus:ring-2 focus:ring-green-600 transition-colors">
          Green Pill
        </button>
      </div>
    </div>

    <!-- Dark Background Outline -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Outline on Dark</h2>
      <div class="flex flex-wrap gap-4 p-6 bg-gray-900 rounded-xl">
        <button class="px-6 py-2.5 border-2 border-white text-white font-medium rounded-lg hover:bg-white hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-white transition-colors">
          White Outline
        </button>
        <button class="px-6 py-2.5 border-2 border-blue-400 text-blue-400 font-medium rounded-lg hover:bg-blue-400 hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-colors">
          Blue Outline
        </button>
        <button class="px-6 py-2.5 border-2 border-gray-600 text-gray-300 font-medium rounded-lg hover:border-gray-400 hover:text-white focus:outline-none focus:ring-2 focus:ring-gray-500 transition-colors">
          Muted Outline
        </button>
      </div>
    </div>

    <!-- Sizes -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Outline Sizes</h2>
      <div class="flex flex-wrap items-center gap-4 p-6 bg-white rounded-xl shadow-sm">
        <button class="px-3 py-1 border-2 border-blue-600 text-blue-600 text-xs font-medium rounded-md hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors">
          Small
        </button>
        <button class="px-4 py-2 border-2 border-blue-600 text-blue-600 text-sm font-medium rounded-lg hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors">
          Default
        </button>
        <button class="px-6 py-3 border-2 border-blue-600 text-blue-600 text-base font-medium rounded-lg hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors">
          Large
        </button>
      </div>
    </div>

  </section>

</body>
</html>
