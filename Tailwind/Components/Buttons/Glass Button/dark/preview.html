<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glass Dark Button | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .glass-dark {
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glass-dark:hover {
      background: rgba(17, 24, 39, 0.9);
      border-color: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body class="min-h-screen p-8" style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);">
  
  <!-- Component: Button / Glass / Dark -->
  
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b border-white/20 pb-4">
      <h1 class="text-3xl font-bold text-white">Button — Glass — Dark</h1>
      <p class="text-white/80 mt-2">Dark glass morphism buttons</p>
    </header>

    <!-- Preview -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-white">Preview</h2>
      <div class="flex flex-wrap gap-4 p-6 rounded-xl">
        <button class="px-6 py-2.5 glass-dark text-white font-medium rounded-lg focus:outline-none focus:ring-2 focus:ring-white/30 transition-all">
          Glass Dark
        </button>
        <button class="px-6 py-2.5 glass-dark text-white font-medium rounded-lg focus:outline-none focus:ring-2 focus:ring-white/30 transition-all" disabled>
          Glass Disabled
        </button>
        <button class="px-6 py-2.5 glass-dark text-white font-medium rounded-full focus:outline-none focus:ring-2 focus:ring-white/30 transition-all">
          Glass Pill
        </button>
      </div>
    </div>

  </section>

</body>
</html>
