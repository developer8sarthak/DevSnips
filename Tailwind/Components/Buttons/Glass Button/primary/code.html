<!-- Glass Primary Button Styles -->
<style>
  .glass-primary {
    background: rgba(59, 130, 246, 0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(59, 130, 246, 0.4);
  }
  .glass-primary:hover {
    background: rgba(59, 130, 246, 0.8);
    border-color: rgba(59, 130, 246, 0.6);
  }
</style>

<!-- Glass Button - Blue -->
<button class="px-6 py-2.5 glass-primary text-white font-medium rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400/50 transition-all">
  Glass Blue
</button>

<!-- Glass Button - Purple -->
<button class="px-6 py-2.5 glass-primary text-white font-medium rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400/50 transition-all" style="background: rgba(168, 85, 247, 0.6); border-color: rgba(168, 85, 247, 0.4);">
  Glass Purple
</button>

<!-- Glass Button - Pink -->
<button class="px-6 py-2.5 glass-primary text-white font-medium rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-400/50 transition-all" style="background: rgba(236, 72, 153, 0.6); border-color: rgba(236, 72, 153, 0.4);">
  Glass Pink
</button>
