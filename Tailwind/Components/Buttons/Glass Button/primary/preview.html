<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glass Primary Button | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .glass-primary {
      background: rgba(59, 130, 246, 0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(59, 130, 246, 0.4);
    }
    .glass-primary:hover {
      background: rgba(59, 130, 246, 0.8);
      border-color: rgba(59, 130, 246, 0.6);
    }
  </style>
</head>
<body class="min-h-screen p-8" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
  
  <!-- Component: Button / Glass / Primary -->
  
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b border-white/20 pb-4">
      <h1 class="text-3xl font-bold text-white">Button — Glass — Primary</h1>
      <p class="text-white/80 mt-2">Color glass morphism buttons</p>
    </header>

    <!-- Preview -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-white">Preview</h2>
      <div class="flex flex-wrap gap-4 p-6 rounded-xl">
        <button class="px-6 py-2.5 glass-primary text-white font-medium rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400/50 transition-all">
          Glass Blue
        </button>
        <button class="px-6 py-2.5 glass-primary text-white font-medium rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400/50 transition-all" style="background: rgba(168, 85, 247, 0.6); border-color: rgba(168, 85, 247, 0.4);">
          Glass Purple
        </button>
        <button class="px-6 py-2.5 glass-primary text-white font-medium rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400/50 transition-all" style="background: rgba(236, 72, 153, 0.6); border-color: rgba(236, 72, 153, 0.4);">
          Glass Pink
        </button>
      </div>
    </div>

  </section>

</body>
</html>
