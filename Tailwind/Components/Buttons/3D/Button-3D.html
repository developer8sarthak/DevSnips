<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button - 3D | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .btn-3d {
      position: relative;
      transition: all 0.1s;
    }
    .btn-3d:active {
      top: 4px;
    }
    .btn-3d-blue {
      background: #2563eb;
      box-shadow: 0 4px 0 #1d4ed8, 0 6px 10px rgba(37, 99, 235, 0.3);
    }
    .btn-3d-blue:active {
      box-shadow: 0 0 0 #1d4ed8, 0 2px 5px rgba(37, 99, 235, 0.3);
    }
    .btn-3d-red {
      background: #dc2626;
      box-shadow: 0 4px 0 #b91c1c, 0 6px 10px rgba(220, 38, 38, 0.3);
    }
    .btn-3d-red:active {
      box-shadow: 0 0 0 #b91c1c, 0 2px 5px rgba(220, 38, 38, 0.3);
    }
    .btn-3d-green {
      background: #16a34a;
      box-shadow: 0 4px 0 #15803d, 0 6px 10px rgba(22, 163, 74, 0.3);
    }
    .btn-3d-green:active {
      box-shadow: 0 0 0 #15803d, 0 2px 5px rgba(22, 163, 74, 0.3);
    }
    .btn-3d-gray {
      background: #4b5563;
      box-shadow: 0 4px 0 #374151, 0 6px 10px rgba(75, 85, 99, 0.3);
    }
    .btn-3d-gray:active {
      box-shadow: 0 0 0 #374151, 0 2px 5px rgba(75, 85, 99, 0.3);
    }
    .btn-3d-purple {
      background: #9333ea;
      box-shadow: 0 4px 0 #7e22ce, 0 6px 10px rgba(147, 51, 234, 0.3);
    }
    .btn-3d-purple:active {
      box-shadow: 0 0 0 #7e22ce, 0 2px 5px rgba(147, 51, 234, 0.3);
    }
    .btn-3d-amber {
      background: #f59e0b;
      box-shadow: 0 4px 0 #d97706, 0 6px 10px rgba(245, 158, 11, 0.3);
    }
    .btn-3d-amber:active {
      box-shadow: 0 0 0 #d97706, 0 2px 5px rgba(245, 158, 11, 0.3);
    }

    /* Extruded style */
    .btn-extruded {
      background: #e5e7eb;
      box-shadow: 4px 4px 0 #9ca3af;
      transition: all 0.1s;
    }
    .btn-extruded:active {
      box-shadow: 2px 2px 0 #9ca3af;
      transform: translate(2px, 2px);
    }

    /* Inset style */
    .btn-inset {
      background: linear-gradient(145deg, #d1d5db, #f3f4f6);
      box-shadow: inset 3px 3px 6px #c9cdd3, inset -3px -3px 6px #ffffff;
    }

    /* Border 3D */
    .btn-border-3d {
      border-style: solid;
      border-width: 4px;
      border-top-color: #1d4ed8;
      border-left-color: #1d4ed8;
      border-bottom-color: #1e40af;
      border-right-color: #1e40af;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  
  <!-- Component: Button / 3D -->
  <!-- Variants: Push 3D, Extruded, Inset, Border 3D -->

  <section class="max-w-4xl mx-auto space-y-12">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Button — 3D</h1>
      <p class="text-gray-600 mt-2">3D depth effect buttons with push animation</p>
    </header>

    <!-- Push 3D Buttons -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Push 3D Effect</h2>
      <div class="flex flex-wrap gap-4 p-6 bg-gradient-to-br from-gray-100 to-gray-200 rounded-xl">
        <button class="btn-3d btn-3d-blue px-6 py-3 text-white font-bold rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
          Blue 3D
        </button>
        
        <button class="btn-3d btn-3d-red px-6 py-3 text-white font-bold rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition-all">
          Red 3D
        </button>
        
        <button class="btn-3d btn-3d-green px-6 py-3 text-white font-bold rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 transition-all">
          Green 3D
        </button>
        
        <button class="btn-3d btn-3d-gray px-6 py-3 text-white font-bold rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-500 transition-all">
          Gray 3D
        </button>
        
        <button class="btn-3d btn-3d-purple px-6 py-3 text-white font-bold rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all">
          Purple 3D
        </button>
        
        <button class="btn-3d btn-3d-amber px-6 py-3 text-white font-bold rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 transition-all">
          Amber 3D
        </button>
      </div>
    </div>

    <!-- Extruded Buttons -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Extruded Effect</h2>
      <div class="flex flex-wrap gap-4 p-6 bg-white rounded-xl shadow-sm">
        <button class="btn-3d btn-extruded px-6 py-3 text-gray-700 font-bold rounded-lg hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-gray-400 transition-all">
          Extruded
        </button>
        
        <button class="btn-3d px-6 py-3 bg-blue-500 text-white font-bold rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" style="box-shadow: 4px 4px 0 #2563eb;">
          Blue Extruded
        </button>
        
        <button class="btn-3d px-6 py-3 bg-pink-500 text-white font-bold rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500 transition-all" style="box-shadow: 4px 4px 0 #db2777;">
          Pink Extruded
        </button>
        
        <button class="btn-3d px-6 py-3 bg-teal-500 text-white font-bold rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 transition-all" style="box-shadow: 4px 4px 0 #0d9488;">
          Teal Extruded
        </button>
      </div>
    </div>

    <!-- Inset Buttons -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Inset Effect</h2>
      <div class="flex flex-wrap gap-4 p-6 bg-gradient-to-br from-gray-200 to-gray-300 rounded-xl">
        <button class="btn-3d btn-inset px-6 py-3 text-gray-600 font-bold rounded-lg hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-gray-400 transition-all">
          Inset Default
        </button>
        
        <button class="btn-3d px-6 py-3 bg-blue-500 text-white font-bold rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" style="box-shadow: inset 3px 3px 6px rgba(0,0,0,0.2);">
          Blue Inset
        </button>
        
        <button class="btn-3d px-6 py-3 bg-rose-500 text-white font-bold rounded-lg focus:outline-none focus:ring-2 focus:ring-rose-500 transition-all" style="box-shadow: inset 3px 3px 6px rgba(0,0,0,0.2);">
          Rose Inset
        </button>
      </div>
    </div>

    <!-- Border 3D -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Border 3D</h2>
      <div class="flex flex-wrap gap-4 p-6 bg-white rounded-xl shadow-sm">
        <button class="btn-3d btn-border-3d px-6 py-3 bg-blue-500 text-white font-bold rounded-lg hover:bg-blue-600 focus:outline-none transition-all">
          Border 3D Blue
        </button>
        
        <button class="btn-3d px-6 py-3 bg-green-500 text-white font-bold rounded-lg hover:bg-green-600 focus:outline-none transition-all" style="border: 4px solid; border-color: #15803d #15803d #166534 #166534;">
          Border 3D Green
        </button>
        
        <button class="btn-3d px-6 py-3 bg-orange-500 text-white font-bold rounded-lg hover:bg-orange-600 focus:outline-none transition-all" style="border: 4px solid; border-color: #c2410c #c2410c #9a3412 #9a3412;">
          Border 3D Orange
        </button>
      </div>
    </div>

    <!-- 3D Sizes -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">3D Sizes</h2>
      <div class="flex flex-wrap items-center gap-4 p-6 bg-gradient-to-br from-gray-100 to-gray-200 rounded-xl">
        <button class="btn-3d btn-3d-blue px-3 py-1.5 text-white text-sm font-bold rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" style="box-shadow: 0 2px 0 #1d4ed8, 0 3px 5px rgba(37, 99, 235, 0.3);">
          Small
        </button>
        
        <button class="btn-3d btn-3d-blue px-4 py-2 text-white font-bold rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" style="box-shadow: 0 3px 0 #1d4ed8, 0 4px 6px rgba(37, 99, 235, 0.3);">
          Default
        </button>
        
        <button class="btn-3d btn-3d-blue px-6 py-3 text-white text-lg font-bold rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" style="box-shadow: 0 4px 0 #1d4ed8, 0 6px 10px rgba(37, 99, 235, 0.3);">
          Large
        </button>
        
        <button class="btn-3d btn-3d-blue px-8 py-4 text-xl font-bold rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" style="box-shadow: 0 5px 0 #1d4ed8, 0 8px 15px rgba(37, 99, 235, 0.3);">
          Extra Large
        </button>
      </div>
    </div>

    <!-- 3D with Icons -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">3D with Icons</h2>
      <div class="flex flex-wrap gap-4 p-6 bg-gradient-to-br from-gray-100 to-gray-200 rounded-xl">
        <button class="btn-3d btn-3d-green inline-flex items-center gap-2 px-5 py-3 text-white font-bold rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
          Confirm
        </button>
        
        <button class="btn-3d btn-3d-red inline-flex items-center gap-2 px-5 py-3 text-white font-bold rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
          Cancel
        </button>
        
        <button class="btn-3d btn-3d-gray inline-flex items-center gap-2 px-5 py-3 text-white font-bold rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-500 transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
          </svg>
          Download
        </button>
      </div>
    </div>

    <!-- 3D Pill Buttons -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">3D Pill Buttons</h2>
      <div class="flex flex-wrap gap-4 p-6 bg-gradient-to-br from-gray-100 to-gray-200 rounded-xl">
        <button class="btn-3d btn-3d-blue px-6 py-2.5 text-white font-bold rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
          Blue Pill
        </button>
        
        <button class="btn-3d btn-3d-purple px-6 py-2.5 text-white font-bold rounded-full focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all">
          Purple Pill
        </button>
        
        <button class="btn-3d btn-3d-green px-6 py-2.5 text-white font-bold rounded-full focus:outline-none focus:ring-2 focus:ring-green-500 transition-all">
          Green Pill
        </button>
      </div>
    </div>

  </section>

</body>
</html>
