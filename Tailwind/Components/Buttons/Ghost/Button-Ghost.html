<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button - Ghost | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  
  <!-- Component: Button / Ghost -->
  <!-- Variants: Transparent, Text-only, Borderless with hover background -->

  <section class="max-w-4xl mx-auto space-y-12">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Button — Ghost</h1>
      <p class="text-gray-600 mt-2">Transparent buttons that show background on hover</p>
    </header>

    <!-- Ghost Primary -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Ghost Primary</h2>
      <div class="flex flex-wrap gap-4 p-6 bg-white rounded-xl shadow-sm">
        <button class="px-6 py-2.5 text-blue-600 font-medium rounded-lg hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors">
          Default
        </button>
        <button class="px-6 py-2.5 text-blue-600 font-medium rounded-lg hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors" disabled>
          Disabled
        </button>
        <button class="px-6 py-2.5 bg-blue-600 text-white font-medium rounded-lg shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors">
          Solid
        </button>
      </div>
    </div>

    <!-- Ghost Colors -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Ghost Colors</h2>
      <div class="flex flex-wrap gap-4 p-6 bg-white rounded-xl shadow-sm">
        <button class="px-6 py-2.5 text-red-500 font-medium rounded-lg hover:bg-red-50 focus:outline-none focus:ring-2 focus:ring-red-400 transition-colors">
          Red
        </button>
        <button class="px-6 py-2.5 text-green-600 font-medium rounded-lg hover:bg-green-50 focus:outline-none focus:ring-2 focus:ring-green-500 transition-colors">
          Green
        </button>
        <button class="px-6 py-2.5 text-amber-500 font-medium rounded-lg hover:bg-amber-50 focus:outline-none focus:ring-2 focus:ring-amber-400 transition-colors">
          Amber
        </button>
        <button class="px-6 py-2.5 text-purple-600 font-medium rounded-lg hover:bg-purple-50 focus:outline-none focus:ring-2 focus:ring-purple-500 transition-colors">
          Purple
        </button>
        <button class="px-6 py-2.5 text-pink-500 font-medium rounded-lg hover:bg-pink-50 focus:outline-none focus:ring-2 focus:ring-pink-400 transition-colors">
          Pink
        </button>
      </div>
    </div>

    <!-- Ghost Dark -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Ghost Dark</h2>
      <div class="flex flex-wrap gap-4 p-6 bg-gray-900 rounded-xl">
        <button class="px-6 py-2.5 text-white font-medium rounded-lg hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-white/50 transition-colors">
          White Ghost
        </button>
        <button class="px-6 py-2.5 text-gray-300 font-medium rounded-lg hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-white/50 transition-colors">
          Gray Ghost
        </button>
        <button class="px-6 py-2.5 text-blue-400 font-medium rounded-lg hover:bg-blue-400/10 focus:outline-none focus:ring-2 focus:ring-blue-400/50 transition-colors">
          Blue Ghost
        </button>
      </div>
    </div>

    <!-- Ghost Sizes -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Ghost Sizes</h2>
      <div class="flex flex-wrap items-center gap-4 p-6 bg-white rounded-xl shadow-sm">
        <button class="px-3 py-1.5 text-blue-600 text-xs font-medium rounded-md hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors">
          Small
        </button>
        <button class="px-4 py-2 text-blue-600 text-sm font-medium rounded-lg hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors">
          Default
        </button>
        <button class="px-6 py-3 text-blue-600 text-base font-medium rounded-lg hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors">
          Large
        </button>
      </div>
    </div>

    <!-- Icon Ghost -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Ghost with Icon</h2>
      <div class="flex flex-wrap gap-4 p-6 bg-white rounded-xl shadow-sm">
        <button class="inline-flex items-center gap-2 px-4 py-2 text-gray-700 font-medium rounded-lg hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-500 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
          </svg>
          Upload
        </button>
        <button class="inline-flex items-center gap-2 px-4 py-2 text-gray-700 font-medium rounded-lg hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-500 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
          </svg>
          Add New
        </button>
        <button class="inline-flex items-center gap-2 px-4 py-2 text-red-500 font-medium rounded-lg hover:bg-red-50 focus:outline-none focus:ring-2 focus:ring-red-400 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
          Delete
        </button>
      </div>
    </div>

  </section>

</body>
</html>
