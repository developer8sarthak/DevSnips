<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button - Minimal | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  
  <!-- Component: Button / Minimal -->
  <!-- Variants: Text-only, Underline, Squish, Simple -->

  <section class="max-w-4xl mx-auto space-y-12">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Button — Minimal</h1>
      <p class="text-gray-600 mt-2">Minimal button styles with subtle interactions</p>
    </header>

    <!-- Text Buttons -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Text Buttons</h2>
      <div class="flex flex-wrap gap-6 p-6 bg-white rounded-xl shadow-sm">
        <button class="text-blue-600 font-medium hover:text-blue-700 hover:underline focus:outline-none focus:ring-2 focus:ring-blue-500 rounded transition-colors">
          Text Button
        </button>
        
        <button class="text-gray-700 font-medium hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-gray-500 rounded transition-colors">
          Neutral Text
        </button>
        
        <button class="text-red-600 font-medium hover:text-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 rounded transition-colors">
          Danger Text
        </button>
        
        <button class="text-gray-400 font-medium hover:text-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-400 rounded transition-colors">
          Muted Text
        </button>
      </div>
    </div>

    <!-- Underlined Buttons -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Underlined Buttons</h2>
      <div class="flex flex-wrap gap-6 p-6 bg-white rounded-xl shadow-sm">
        <button class="text-blue-600 font-medium hover:text-blue-800 hover:underline underline-offset-4 focus:outline-none focus:ring-2 focus:ring-blue-500 rounded transition-all">
          Underlined
        </button>
        
        <button class="text-gray-700 font-medium border-b-2 border-transparent hover:border-gray-400 hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-gray-500 rounded-none transition-all">
          Border Bottom
        </button>
        
        <button class="text-purple-600 font-medium relative hover:text-purple-800 group focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all">
          <span>Animated Underline</span>
          <span class="absolute bottom-0 left-0 w-0 h-0.5 bg-purple-600 group-hover:w-full transition-all duration-300"></span>
        </button>
      </div>
    </div>

    <!-- Squish Buttons -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Squish Effect</h2>
      <div class="flex flex-wrap gap-4 p-6 bg-white rounded-xl shadow-sm">
        <button class="px-6 py-3 text-gray-700 font-medium rounded-lg hover:bg-gray-100 active:bg-gray-200 active:scale-95 focus:outline-none focus:ring-2 focus:ring-gray-400 transition-all">
          Squish Button
        </button>
        
        <button class="px-6 py-3 text-blue-600 font-medium rounded-lg hover:bg-blue-50 active:bg-blue-100 active:scale-95 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all">
          Blue Squish
        </button>
        
        <button class="px-6 py-3 text-green-600 font-medium rounded-lg hover:bg-green-50 active:bg-green-100 active:scale-95 focus:outline-none focus:ring-2 focus:ring-green-400 transition-all">
          Green Squish
        </button>
        
        <button class="px-6 py-3 text-red-600 font-medium rounded-lg hover:bg-red-50 active:bg-red-100 active:scale-95 focus:outline-none focus:ring-2 focus:ring-red-400 transition-all">
          Red Squish
        </button>
      </div>
    </div>

    <!-- Simple Buttons -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Simple Buttons</h2>
      <div class="flex flex-wrap gap-4 p-6 bg-white rounded-xl shadow-sm">
        <button class="px-4 py-2 text-gray-600 font-medium rounded hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-300 transition-colors">
          Simple Gray
        </button>
        
        <button class="px-4 py-2 text-blue-600 font-medium rounded hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-300 transition-colors">
          Simple Blue
        </button>
        
        <button class="px-4 py-2 text-gray-400 border border-gray-200 font-medium rounded hover:border-gray-300 hover:text-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-300 transition-all">
          Simple Outlined
        </button>
        
        <button class="px-4 py-2 text-gray-400 font-medium rounded hover:text-gray-600 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-300 transition-all">
          Simple Ghost
        </button>
      </div>
    </div>

    <!-- Minimal Sizes -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Minimal Sizes</h2>
      <div class="flex flex-wrap items-center gap-4 p-6 bg-white rounded-xl shadow-sm">
        <button class="px-2 py-1 text-xs text-blue-600 font-medium rounded hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-colors">
          Extra Small
        </button>
        
        <button class="px-3 py-1.5 text-sm text-blue-600 font-medium rounded hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-colors">
          Small
        </button>
        
        <button class="px-4 py-2 text-blue-600 font-medium rounded hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-colors">
          Default
        </button>
        
        <button class="px-5 py-2.5 text-base text-blue-600 font-medium rounded hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-colors">
          Large
        </button>
      </div>
    </div>

    <!-- Minimal with Icons -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Minimal with Icons</h2>
      <div class="flex flex-wrap gap-4 p-6 bg-white rounded-xl shadow-sm">
        <button class="inline-flex items-center gap-1.5 px-3 py-1.5 text-gray-600 font-medium rounded-lg hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-400 transition-all">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
          </svg>
          Add
        </button>
        
        <button class="inline-flex items-center gap-1.5 px-3 py-1.5 text-gray-600 font-medium rounded-lg hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-400 transition-all">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
          </svg>
          Upload
        </button>
        
        <button class="inline-flex items-center gap-1.5 px-3 py-1.5 text-blue-600 font-medium rounded-lg hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
          </svg>
          Save
        </button>
        
        <button class="inline-flex items-center gap-1.5 px-3 py-1.5 text-red-600 font-medium rounded-lg hover:bg-red-50 focus:outline-none focus:ring-2 focus:ring-red-400 transition-all">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
          Delete
        </button>
      </div>
    </div>

    <!-- Pill Minimal -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Pill Minimal</h2>
      <div class="flex flex-wrap gap-3 p-6 bg-white rounded-xl shadow-sm">
        <button class="px-4 py-1.5 text-gray-600 font-medium rounded-full hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-300 transition-colors">
          Pill One
        </button>
        
        <button class="px-4 py-1.5 text-blue-600 font-medium rounded-full hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-300 transition-colors">
          Pill Two
        </button>
        
        <button class="px-4 py-1.5 text-green-600 font-medium rounded-full hover:bg-green-50 focus:outline-none focus:ring-2 focus:ring-green-300 transition-colors">
          Pill Three
        </button>
        
        <button class="px-4 py-1.5 text-purple-600 font-medium rounded-full hover:bg-purple-50 focus:outline-none focus:ring-2 focus:ring-purple-300 transition-colors">
          Pill Four
        </button>
      </div>
    </div>

    <!-- Dark Mode Minimal -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Dark Mode Minimal</h2>
      <div class="flex flex-wrap gap-4 p-6 bg-gray-900 rounded-xl">
        <button class="text-white font-medium hover:text-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 rounded transition-colors">
          White Text
        </button>
        
        <button class="text-gray-400 font-medium hover:text-white hover:bg-white/10 px-3 py-1.5 rounded focus:outline-none focus:ring-2 focus:ring-gray-500 transition-all">
          Gray Hover
        </button>
        
        <button class="text-blue-400 font-medium hover:text-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-500 rounded transition-colors">
          Blue Text
        </button>
        
        <button class="text-gray-300 border border-gray-700 font-medium rounded-lg px-4 py-2 hover:border-gray-600 hover:bg-white/5 focus:outline-none focus:ring-2 focus:ring-gray-600 transition-all">
          Outlined
        </button>
      </div>
    </div>

  </section>

</body>
</html>
