<!--
Snippet Name: Basic Toast
Description: Auto-dismissing success toast with icon, message, and close button. Slides in, pauses, then fades out.
Author: DevSnips Contributors
Usage Example: Drop into any app and call showToast() after a successful save or async action.
-->
<!-- Toast region: announce politely, don't interrupt screen readers -->
<div
  id="toast-region"
  class="pointer-events-none fixed bottom-4 right-4 z-50 flex w-full max-w-sm flex-col items-end gap-3"
  role="region"
  aria-label="Notifications"
  aria-live="polite"
  data-toast-region
></div>

<!-- Demo trigger button -->
<button
  type="button"
  onclick="showToast()"
  class="inline-flex items-center gap-2 rounded-xl bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-blue-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2"
>
  <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
  </svg>
  Save changes
</button>

<!-- Toast template + scoped logic -->
<template id="toast-template">
  <div
    class="toast-item pointer-events-auto flex w-full items-start gap-3 rounded-xl border border-gray-200 bg-white p-4 shadow-lg ring-1 ring-black/5"
    role="status"
  >
    <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-green-100 text-green-600">
      <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
      </svg>
    </span>
    <div class="min-w-0 flex-1">
      <p class="text-sm font-semibold text-gray-900">Changes saved</p>
      <p class="mt-0.5 text-sm text-gray-500">Your settings have been updated successfully.</p>
    </div>
    <button
      type="button"
      class="toast-close shrink-0 rounded-md p-1 text-gray-400 transition-colors hover:bg-gray-100 hover:text-gray-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
      aria-label="Dismiss notification"
    >
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
</template>

<script>
  (function () {
    const region = document.currentScript.closest('[data-toast-region]');
    if (!region) return;
    const template = document.getElementById('toast-template');

    function dismiss(toast) {
      if (!toast || toast.dataset.dismissed === 'true') return;
      toast.dataset.dismissed = 'true';
      toast.classList.add('translate-x-2', 'opacity-0');
      toast.addEventListener('transitionend', () => toast.remove(), { once: true });
      setTimeout(() => toast.remove(), 400);
    }

    function showToast() {
      if (!template) return;
      const toast = template.content.firstElementChild.cloneNode(true);
      region.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.add('transition', 'duration-300', 'ease-out');
      });

      const timer = setTimeout(() => dismiss(toast), 4000);
      const closeBtn = toast.querySelector('.toast-close');
      if (closeBtn) {
        closeBtn.addEventListener('click', () => {
          clearTimeout(timer);
          dismiss(toast);
        });
      }
      toast.addEventListener('mouseenter', () => clearTimeout(timer));
    }

    window.showToast = showToast;
  })();
</script>
