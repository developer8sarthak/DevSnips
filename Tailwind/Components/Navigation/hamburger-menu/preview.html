<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamburger Menu | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
  
  <!-- Component: Hamburger Menu -->
  
  <div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-2xl p-8 shadow-sm border border-gray-100">
      <h1 class="text-2xl font-bold text-gray-900 mb-4">Hamburger Menu</h1>
      <p class="text-gray-600 mb-8">Click the hamburger button below to open the slide-out menu with animation.</p>
      
      <div class="flex justify-center">
        <div class="relative">
          <!-- Hamburger Button -->
          <button id="hamburger-btn" class="flex flex-col justify-center items-center w-14 h-14 rounded-xl bg-gray-100 hover:bg-gray-200 transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500" aria-label="Menu" aria-expanded="false">
            <span class="hamburger-line w-6 h-0.5 bg-gray-700 rounded-full transition-all duration-300"></span>
            <span class="hamburger-line w-6 h-0.5 bg-gray-700 rounded-full transition-all duration-300 my-1.5"></span>
            <span class="hamburger-line w-6 h-0.5 bg-gray-700 rounded-full transition-all duration-300"></span>
          </button>

          <!-- Slide-out Menu -->
          <div id="hamburger-menu" class="absolute left-0 top-full mt-2 w-72 bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden transform -translate-x-full opacity-0 transition-all duration-300 z-50">
            <div class="p-4 border-b border-gray-100">
              <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-gradient-to-br from-indigo-400 to-purple-500 rounded-full flex items-center justify-center">
                  <span class="text-white font-medium">JD</span>
                </div>
                <div>
                  <p class="font-semibold text-gray-900">John Doe</p>
                  <p class="text-sm text-gray-500">john@example.com</p>
                </div>
              </div>
            </div>
            <nav class="p-2">
              <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-xl transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
                <span>Profile</span>
              </a>
              <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-xl transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
                </svg>
                <span>Saved Items</span>
              </a>
              <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-xl transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
                <span>Settings</span>
              </a>
              <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-xl transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span>Help</span>
              </a>
            </nav>
            <div class="p-4 border-t border-gray-100">
              <a href="#" class="flex items-center gap-3 px-4 py-3 text-red-600 hover:bg-red-50 rounded-xl transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                </svg>
                <span>Sign Out</span>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const btn = document.getElementById('hamburger-btn');
    const menu = document.getElementById('hamburger-menu');
    const lines = document.querySelectorAll('.hamburger-line');

    btn.addEventListener('click', () => {
      const isOpen = !menu.classList.contains('-translate-x-full');
      
      if (isOpen) {
        menu.classList.add('-translate-x-full', 'opacity-0');
        menu.classList.remove('translate-x-0', 'opacity-100');
        btn.setAttribute('aria-expanded', 'false');
        lines[0].style.transform = '';
        lines[1].style.opacity = '';
        lines[2].style.transform = '';
      } else {
        menu.classList.remove('-translate-x-full', 'opacity-0');
        menu.classList.add('translate-x-0', 'opacity-100');
        btn.setAttribute('aria-expanded', 'true');
        lines[0].style.transform = 'rotate(45deg) translateY(6px)';
        lines[1].style.opacity = '0';
        lines[2].style.transform = 'rotate(-45deg) translateY(-6px)';
      }
    });

    // Close on click outside
    document.addEventListener('click', (e) => {
      if (!btn.contains(e.target) && !menu.contains(e.target) && !menu.classList.contains('-translate-x-full')) {
        menu.classList.add('-translate-x-full', 'opacity-0');
        menu.classList.remove('translate-x-0', 'opacity-100');
        btn.setAttribute('aria-expanded', 'false');
        lines[0].style.transform = '';
        lines[1].style.opacity = '';
        lines[2].style.transform = '';
      }
    });
  </script>

</body>
</html>
