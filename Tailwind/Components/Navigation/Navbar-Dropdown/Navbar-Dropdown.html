<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar with Dropdown | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Variant 1: Single Dropdown -->
  <nav class="max-w-7xl mx-auto bg-white border rounded-xl shadow-sm px-6 py-4 mb-4">
    <div class="flex justify-between items-center">
      <a href="#" class="text-xl font-bold text-gray-900">Logo</a>
      <div class="hidden md:flex items-center gap-8">
        <div class="relative group">
          <button class="flex items-center gap-1 text-gray-600 hover:text-gray-900 transition-colors py-4">
            Products
            <svg class="w-4 h-4 transition-transform group-hover:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </button>
          <div class="absolute top-full left-0 pt-2 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all">
            <div class="bg-white border rounded-lg shadow-xl p-4 min-w-48">
              <a href="#" class="block px-4 py-2 text-gray-600 hover:bg-gray-50 hover:text-gray-900 rounded">Product 1</a>
              <a href="#" class="block px-4 py-2 text-gray-600 hover:bg-gray-50 hover:text-gray-900 rounded">Product 2</a>
              <a href="#" class="block px-4 py-2 text-gray-600 hover:bg-gray-50 hover:text-gray-900 rounded">Product 3</a>
            </div>
          </div>
        </div>
        <a href="#" class="text-gray-600 hover:text-gray-900 transition-colors">Pricing</a>
        <a href="#" class="text-gray-600 hover:text-gray-900 transition-colors">Blog</a>
      </div>
    </div>
  </nav>

  <!-- Variant 2: Multiple Dropdowns -->
  <nav class="max-w-7xl mx-auto bg-white border rounded-xl shadow-sm px-6 py-4 mb-4">
    <div class="flex justify-between items-center">
      <a href="#" class="text-xl font-bold text-gray-900">Brand</a>
      <div class="hidden md:flex items-center gap-6">
        <div class="relative group">
          <button class="flex items-center gap-1 text-gray-600 hover:text-gray-900 transition-colors">
            Solutions
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </button>
          <div class="absolute top-full left-0 pt-2 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all z-10">
            <div class="bg-white border rounded-lg shadow-xl p-4 w-56">
              <a href="#" class="block px-4 py-2 text-gray-600 hover:bg-gray-50 rounded">Enterprise</a>
              <a href="#" class="block px-4 py-2 text-gray-600 hover:bg-gray-50 rounded">Small Business</a>
              <a href="#" class="block px-4 py-2 text-gray-600 hover:bg-gray-50 rounded">Startup</a>
            </div>
          </div>
        </div>
        <div class="relative group">
          <button class="flex items-center gap-1 text-gray-600 hover:text-gray-900 transition-colors">
            Resources
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </button>
          <div class="absolute top-full left-0 pt-2 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all z-10">
            <div class="bg-white border rounded-lg shadow-xl p-4 w-48">
              <a href="#" class="block px-4 py-2 text-gray-600 hover:bg-gray-50 rounded">Documentation</a>
              <a href="#" class="block px-4 py-2 text-gray-600 hover:bg-gray-50 rounded">Tutorials</a>
              <a href="#" class="block px-4 py-2 text-gray-600 hover:bg-gray-50 rounded">Blog</a>
            </div>
          </div>
        </div>
        <a href="#" class="text-gray-600 hover:text-gray-900 transition-colors">Pricing</a>
      </div>
    </div>
  </nav>

  <!-- Variant 3: Icon Dropdown -->
  <nav class="max-w-7xl mx-auto bg-gray-900 rounded-xl px-6 py-4">
    <div class="flex justify-between items-center">
      <a href="#" class="text-xl font-bold text-white">Logo</a>
      <div class="hidden md:flex items-center gap-6">
        <a href="#" class="text-gray-300 hover:text-white transition-colors">Home</a>
        <a href="#" class="text-gray-300 hover:text-white transition-colors">About</a>
        <div class="relative group">
          <button class="flex items-center gap-1 text-gray-300 hover:text-white transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
            Apps
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </button>
          <div class="absolute top-full right-0 pt-2 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all z-10">
            <div class="bg-gray-800 border border-gray-700 rounded-lg shadow-xl p-2 w-40">
              <a href="#" class="flex items-center gap-2 px-4 py-2 text-gray-300 hover:bg-gray-700 hover:text-white rounded">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                Dashboard
              </a>
              <a href="#" class="flex items-center gap-2 px-4 py-2 text-gray-300 hover:bg-gray-700 hover:text-white rounded">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                Analytics
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </nav>

</body>
</html>
