<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transparent Navbar | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Variant 1: Dark Background -->
  <div class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 rounded-2xl p-8 mb-4">
    <nav class="max-w-7xl mx-auto">
      <div class="flex justify-between items-center">
        <a href="#" class="text-2xl font-bold text-white">Logo</a>
        <div class="hidden md:flex items-center gap-8">
          <a href="#" class="text-white/80 hover:text-white transition-colors">Home</a>
          <a href="#" class="text-white/80 hover:text-white transition-colors">About</a>
          <a href="#" class="text-white/80 hover:text-white transition-colors">Services</a>
          <a href="#" class="text-white/80 hover:text-white transition-colors">Contact</a>
        </div>
        <button class="px-6 py-2.5 bg-white/10 backdrop-blur-sm text-white border border-white/20 rounded-lg hover:bg-white/20 transition-all">
          Join Now
        </button>
      </div>
    </nav>
  </div>

  <!-- Variant 2: Gradient Background -->
  <div class="bg-gradient-to-r from-blue-600 to-purple-600 rounded-2xl p-8 mb-4">
    <nav class="max-w-7xl mx-auto">
      <div class="flex justify-between items-center">
        <a href="#" class="text-2xl font-bold text-white">Brand</a>
        <div class="hidden md:flex items-center gap-8">
          <a href="#" class="text-white/90 hover:text-white transition-colors">Features</a>
          <a href="#" class="text-white/90 hover:text-white transition-colors">Pricing</a>
          <a href="#" class="text-white/90 hover:text-white transition-colors">Docs</a>
        </div>
        <button class="px-4 py-2 bg-white text-blue-600 rounded-lg font-medium hover:bg-gray-100 transition-colors">Get Started</button>
      </div>
    </nav>
  </div>

  <!-- Variant 3: Image Overlay Style -->
  <div class="relative rounded-2xl overflow-hidden h-64 mb-4">
    <img src="https://images.unsplash.com/photo-1557683316-973673baf926?w=1200" alt="Background" class="w-full h-full object-cover">
    <div class="absolute inset-0 bg-black/40"></div>
    <nav class="absolute inset-x-0 top-0 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <a href="#" class="text-2xl font-bold text-white">Logo</a>
        <div class="hidden md:flex items-center gap-8">
          <a href="#" class="text-white/90 hover:text-white transition-colors">Home</a>
          <a href="#" class="text-white/90 hover:text-white transition-colors">About</a>
          <a href="#" class="text-white/90 hover:text-white transition-colors">Contact</a>
        </div>
        <button class="px-6 py-2.5 bg-white text-gray-900 rounded-lg font-medium hover:bg-gray-100 transition-colors">Sign In</button>
      </div>
    </nav>
  </div>

</body>
</html>
