<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horizontal Navigation | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  
  <!-- Component: Horizontal Navigation -->
  
  <div class="max-w-4xl mx-auto px-4 sm:px-8">
    <div class="bg-white rounded-2xl p-4 sm:p-8 shadow-sm border border-gray-100">
      <h1 class="text-2xl font-bold text-gray-900 mb-6">Horizontal Navigation</h1>
      
      <!-- Example 1: Standard -->
      <div class="mb-8">
        <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-4">Standard</h2>
        <nav class="flex items-center gap-1 overflow-x-auto max-w-full -mx-1 px-1 pb-2">
          <a href="#" class="px-4 py-2 shrink-0 whitespace-nowrap text-gray-900 font-medium rounded-lg hover:bg-gray-100 transition-colors">Home</a>
          <a href="#" class="px-4 py-2 shrink-0 whitespace-nowrap text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-lg transition-colors">Products</a>
          <a href="#" class="px-4 py-2 shrink-0 whitespace-nowrap text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-lg transition-colors">Pricing</a>
          <a href="#" class="px-4 py-2 shrink-0 whitespace-nowrap text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-lg transition-colors">About</a>
          <a href="#" class="px-4 py-2 shrink-0 whitespace-nowrap text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-lg transition-colors">Contact</a>
        </nav>
      </div>

      <!-- Example 2: With Dropdown -->
      <div class="mb-8">
        <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-4">With Dropdown</h2>
        <nav class="flex items-center gap-1 overflow-x-auto max-w-full -mx-1 px-1 pb-2">
          <a href="#" class="px-4 py-2 shrink-0 whitespace-nowrap text-gray-900 font-medium rounded-lg hover:bg-gray-100 transition-colors">Home</a>
          <div class="relative group">
            <button class="flex items-center gap-1 px-4 py-2 shrink-0 whitespace-nowrap text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-lg transition-colors font-medium">
              Products
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </button>
            <div class="absolute left-0 top-full mt-1 w-48 bg-white rounded-xl shadow-lg border border-gray-100 py-2 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all z-10">
              <a href="#" class="block px-4 py-2 text-gray-600 hover:bg-gray-50">Electronics</a>
              <a href="#" class="block px-4 py-2 text-gray-600 hover:bg-gray-50">Clothing</a>
              <a href="#" class="block px-4 py-2 text-gray-600 hover:bg-gray-50">Home & Garden</a>
              <a href="#" class="block px-4 py-2 text-gray-600 hover:bg-gray-50">Sports</a>
            </div>
          </div>
          <a href="#" class="px-4 py-2 shrink-0 whitespace-nowrap text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-lg transition-colors">Pricing</a>
          <a href="#" class="px-4 py-2 shrink-0 whitespace-nowrap text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-lg transition-colors">About</a>
          <a href="#" class="px-4 py-2 shrink-0 whitespace-nowrap text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-lg transition-colors">Contact</a>
        </nav>
      </div>

      <!-- Example 3: Pills Style -->
      <div>
        <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-4">Pills Style</h2>
        <nav class="flex items-center gap-2 overflow-x-auto max-w-full -mx-1 px-1 pb-2">
          <a href="#" class="px-4 py-2 shrink-0 whitespace-nowrap bg-gray-900 text-white font-medium rounded-full transition-colors">All</a>
          <a href="#" class="px-4 py-2 shrink-0 whitespace-nowrap text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-full transition-colors">Active</a>
          <a href="#" class="px-4 py-2 shrink-0 whitespace-nowrap text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-full transition-colors">Pending</a>
          <a href="#" class="px-4 py-2 shrink-0 whitespace-nowrap text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-full transition-colors">Completed</a>
          <a href="#" class="px-4 py-2 shrink-0 whitespace-nowrap text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-full transition-colors">Archived</a>
        </nav>
      </div>
    </div>
  </div>

</body>
</html>
