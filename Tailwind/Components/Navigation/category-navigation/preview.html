<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category Navigation | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  
  <!-- Component: Category Navigation -->
  
  <div class="max-w-4xl mx-auto">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
      <!-- Sidebar -->
      <div class="md:col-span-1">
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
          <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-4 px-4">Categories</h2>
          <nav class="space-y-2">
            <div class="flex items-center justify-between px-4 py-3 bg-indigo-50 rounded-xl cursor-pointer">
              <div class="flex items-center gap-3">
                <span class="text-2xl">🍔</span>
                <span class="font-medium text-indigo-700">Food & Dining</span>
              </div>
              <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </div>
            
            <div class="pl-6 space-y-1">
              <a href="#" class="flex items-center gap-3 px-4 py-2.5 text-gray-600 hover:bg-gray-50 rounded-lg transition-colors">
                <span>Fast Food</span>
                <span class="ml-auto text-xs text-gray-400 bg-gray-100 px-2 py-0.5 rounded-full">124</span>
              </a>
              <a href="#" class="flex items-center gap-3 px-4 py-2.5 text-indigo-600 bg-indigo-50 rounded-lg font-medium">
                <span>Restaurants</span>
                <span class="ml-auto text-xs text-indigo-400 bg-indigo-100 px-2 py-0.5 rounded-full">89</span>
              </a>
              <a href="#" class="flex items-center gap-3 px-4 py-2.5 text-gray-600 hover:bg-gray-50 rounded-lg transition-colors">
                <span>Cafes</span>
                <span class="ml-auto text-xs text-gray-400 bg-gray-100 px-2 py-0.5 rounded-full">56</span>
              </a>
            </div>

            <div class="flex items-center justify-between px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-xl cursor-pointer transition-colors">
              <div class="flex items-center gap-3">
                <span class="text-2xl">🛍️</span>
                <span>Shopping</span>
              </div>
              <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </div>

            <div class="flex items-center justify-between px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-xl cursor-pointer transition-colors">
              <div class="flex items-center gap-3">
                <span class="text-2xl">🎬</span>
                <span>Entertainment</span>
              </div>
              <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </div>

            <div class="flex items-center justify-between px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-xl cursor-pointer transition-colors">
              <div class="flex items-center gap-3">
                <span class="text-2xl">🏥</span>
                <span>Health</span>
              </div>
              <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </div>

            <div class="flex items-center justify-between px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-xl cursor-pointer transition-colors">
              <div class="flex items-center gap-3">
                <span class="text-2xl">✈️</span>
                <span>Travel</span>
              </div>
              <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </div>
          </nav>
        </div>
      </div>

      <!-- Content -->
      <div class="md:col-span-3">
        <div class="bg-white rounded-2xl p-8 shadow-sm border border-gray-100">
          <h1 class="text-2xl font-bold text-gray-900 mb-4">Category Navigation</h1>
          <p class="text-gray-600">Hierarchical category tree navigation with emoji icons and item counts. Expandable sections with nested links.</p>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
