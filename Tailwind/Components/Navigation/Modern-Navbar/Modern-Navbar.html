<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Navbar | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Component: Modern Navbar - Variant 1: Default Light -->
  <nav class="bg-white border-b">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <div class="flex items-center gap-8">
          <a href="#" class="text-xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">Brand</a>
          <div class="hidden md:flex items-center gap-6">
            <a href="#" class="text-gray-600 hover:text-gray-900 transition-colors">Products</a>
            <a href="#" class="text-gray-600 hover:text-gray-900 transition-colors">Solutions</a>
            <a href="#" class="text-gray-600 hover:text-gray-900 transition-colors">Pricing</a>
            <a href="#" class="text-gray-600 hover:text-gray-900 transition-colors">Resources</a>
          </div>
        </div>
        <div class="flex items-center gap-4">
          <button class="text-gray-600 hover:text-gray-900 transition-colors">Sign In</button>
          <button class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">Get Started</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Component: Modern Navbar - Variant 2: Centered Logo -->
  <nav class="bg-white border-b mt-4">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <div class="flex items-center gap-6">
          <a href="#" class="text-gray-600 hover:text-gray-900 transition-colors">Home</a>
          <a href="#" class="text-gray-600 hover:text-gray-900 transition-colors">About</a>
        </div>
        <a href="#" class="text-xl font-bold text-gray-900">Logo</a>
        <div class="flex items-center gap-6">
          <a href="#" class="text-gray-600 hover:text-gray-900 transition-colors">Services</a>
          <a href="#" class="text-gray-600 hover:text-gray-900 transition-colors">Contact</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Component: Modern Navbar - Variant 3: With Icons -->
  <nav class="bg-white border-b mt-4">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <div class="flex items-center gap-8">
          <a href="#" class="text-2xl font-bold text-gray-900">Brand</a>
          <div class="hidden md:flex items-center gap-1">
            <a href="#" class="px-4 py-2 text-gray-600 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors">Home</a>
            <a href="#" class="px-4 py-2 text-gray-600 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors">Shop</a>
            <a href="#" class="px-4 py-2 text-gray-600 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors">Blog</a>
            <a href="#" class="px-4 py-2 text-gray-600 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors">Pages</a>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <button class="p-2 text-gray-500 hover:text-gray-900 hover:bg-gray-100 rounded-lg">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          </button>
          <button class="p-2 text-gray-500 hover:text-gray-900 hover:bg-gray-100 rounded-lg relative">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.451L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
            <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
          </button>
          <button class="px-4 py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-800">Sign In</button>
        </div>
      </div>
    </div>
  </nav>

</body>
</html>
