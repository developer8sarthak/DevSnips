<!-- Subscription Modal -->
<div id="subscription-modal" class="fixed inset-0 z-50 hidden">
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-black/60 backdrop-blur-sm" onclick="closeModal('subscription-modal')"></div>
  
  <!-- Modal Container -->
  <div class="fixed inset-0 flex items-center justify-center p-4">
    <div class="relative bg-white dark:bg-gray-900 rounded-2xl shadow-2xl w-full max-w-4xl overflow-hidden" role="dialog" aria-modal="true">
      
      <!-- Close Button -->
      <button onclick="closeModal('subscription-modal')" class="absolute top-4 right-4 z-10 p-2 rounded-lg text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
      
      <!-- Content Grid -->
      <div class="grid md:grid-cols-2">
        <!-- Left: CTA -->
        <div class="bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-600 p-8 md:p-12 text-white">
          <div class="badge mb-6">
            <span class="inline-flex items-center gap-1 px-3 py-1 bg-white/20 backdrop-blur rounded-full text-sm font-medium">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
              </svg>
              Most Popular
            </span>
          </div>
          
          <h3 class="text-3xl font-bold mb-4">Unlock Premium Features</h3>
          <p class="text-white/80 mb-8">Get unlimited access to all features, priority support, and early access to new releases.</p>
          
          <ul class="space-y-4 mb-8">
            <li class="flex items-center gap-3">
              <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
              </svg>
              <span>Unlimited projects</span>
            </li>
            <li class="flex items-center gap-3">
              <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
              </svg>
              <span>Advanced analytics</span>
            </li>
            <li class="flex items-center gap-3">
              <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
              </svg>
              <span>Priority support</span>
            </li>
            <li class="flex items-center gap-3">
              <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
              </svg>
              <span>Team collaboration</span>
            </li>
          </ul>
          
          <div class="flex items-baseline gap-2">
            <span class="text-4xl font-bold">$29</span>
            <span class="text-white/60">/month</span>
          </div>
        </div>
        
        <!-- Right: Plans -->
        <div class="p-8 md:p-12">
          <h3 class="text-xl font-semibold text-gray-900 dark:text-white mb-6">Choose Your Plan</h3>
          
          <div class="space-y-4 mb-8">
            <!-- Monthly -->
            <label class="flex items-center gap-4 p-4 border-2 border-indigo-600 bg-indigo-50 dark:bg-indigo-900/20 rounded-xl cursor-pointer">
              <input type="radio" name="plan" checked class="w-5 h-5 text-indigo-600">
              <div class="flex-1">
                <p class="font-medium text-gray-900 dark:text-white">Monthly</p>
                <p class="text-sm text-gray-500 dark:text-gray-400">Billed monthly</p>
              </div>
              <span class="font-semibold text-gray-900 dark:text-white">$29/mo</span>
            </label>
            
            <!-- Annual -->
            <label class="flex items-center gap-4 p-4 border border-gray-200 dark:border-gray-700 rounded-xl cursor-pointer hover:border-gray-300 dark:hover:border-gray-600 transition-colors">
              <input type="radio" name="plan" class="w-5 h-5 text-indigo-600">
              <div class="flex-1">
                <p class="font-medium text-gray-900 dark:text-white">Annual</p>
                <p class="text-sm text-gray-500 dark:text-gray-400">Save 40%</p>
              </div>
              <div class="text-right">
                <span class="font-semibold text-gray-900 dark:text-white">$199/yr</span>
                <span class="block text-xs text-green-600 dark:text-green-400">Save $149</span>
              </div>
            </label>
            
            <!-- Lifetime -->
            <label class="flex items-center gap-4 p-4 border border-gray-200 dark:border-gray-700 rounded-xl cursor-pointer hover:border-gray-300 dark:hover:border-gray-600 transition-colors">
              <input type="radio" name="plan" class="w-5 h-5 text-indigo-600">
              <div class="flex-1">
                <p class="font-medium text-gray-900 dark:text-white">Lifetime</p>
                <p class="text-sm text-gray-500 dark:text-gray-400">One-time payment</p>
              </div>
              <span class="font-semibold text-gray-900 dark:text-white">$499</span>
            </label>
          </div>
          
          <!-- Payment Button -->
          <button onclick="closeModal('subscription-modal')" class="w-full py-4 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold rounded-xl hover:from-indigo-700 hover:to-purple-700 transition-all focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 shadow-lg shadow-indigo-500/30 flex items-center justify-center gap-2">
            <span>Subscribe Now</span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
            </svg>
          </button>
          
          <p class="text-center text-sm text-gray-500 dark:text-gray-400 mt-4">
            Cancel anytime. No questions asked.
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Demo Trigger Button -->
<button onclick="openModal('subscription-modal')" class="px-6 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-medium rounded-xl hover:from-indigo-700 hover:to-purple-700 transition-all focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">Open Subscription Modal</button>
