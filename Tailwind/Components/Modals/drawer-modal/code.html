<!-- Drawer Modal -->
<div id="drawer-modal" class="fixed inset-0 z-50 hidden">
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-black/50 backdrop-blur-sm transition-opacity" onclick="closeDrawer('drawer-modal')"></div>
  
  <!-- Drawer -->
  <div id="drawer-panel" class="fixed inset-y-0 right-0 w-full max-w-md bg-white dark:bg-gray-900 shadow-2xl transform transition-transform duration-300 translate-x-0">
    
    <!-- Header -->
    <div class="flex items-center justify-between p-6 border-b border-gray-100 dark:border-gray-800">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-cyan-100 dark:bg-cyan-900/30 rounded-xl flex items-center justify-center">
          <svg class="w-5 h-5 text-cyan-600 dark:text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
        </div>
        <div>
          <h3 class="text-lg font-semibold text-gray-900 dark:text-white">Team Members</h3>
          <p class="text-sm text-gray-500 dark:text-gray-400">Manage your team</p>
        </div>
      </div>
      <button onclick="closeDrawer('drawer-modal')" class="p-2 rounded-lg text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    
    <!-- Search -->
    <div class="p-6 pb-0">
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
          <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>
        <input type="text" placeholder="Search team members..." class="w-full pl-12 pr-4 py-3 bg-gray-50 dark:bg-gray-800 border-0 rounded-xl text-gray-900 dark:text-white placeholder-gray-400 focus:ring-2 focus:ring-cyan-500 transition-all">
      </div>
    </div>
    
    <!-- Members List -->
    <div class="p-6 space-y-4 overflow-y-auto max-h-[calc(100vh-280px)]">
      <!-- Owner -->
      <div class="flex items-center gap-4 p-3 rounded-xl bg-gradient-to-r from-cyan-50 to-blue-50 dark:from-cyan-900/20 dark:to-blue-900/20">
        <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=48&h=48&fit=crop" class="w-12 h-12 rounded-full object-cover">
        <div class="flex-1 min-w-0">
          <p class="font-medium text-gray-900 dark:text-white">Marcus Chen</p>
          <p class="text-sm text-gray-500 dark:text-gray-400">marcus@company.com</p>
        </div>
        <span class="px-2 py-1 text-xs font-medium text-cyan-600 dark:text-cyan-400 bg-cyan-100 dark:bg-cyan-900/30 rounded-full">Owner</span>
      </div>
      
      <!-- Admin -->
      <div class="flex items-center gap-4 p-3 rounded-xl hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=48&h=48&fit=crop" class="w-12 h-12 rounded-full object-cover">
        <div class="flex-1 min-w-0">
          <p class="font-medium text-gray-900 dark:text-white">Sarah Wilson</p>
          <p class="text-sm text-gray-500 dark:text-gray-400">sarah@company.com</p>
        </div>
        <span class="px-2 py-1 text-xs font-medium text-purple-600 dark:text-purple-400 bg-purple-100 dark:bg-purple-900/30 rounded-full">Admin</span>
      </div>
      
      <!-- Member -->
      <div class="flex items-center gap-4 p-3 rounded-xl hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=48&h=48&fit=crop" class="w-12 h-12 rounded-full object-cover">
        <div class="flex-1 min-w-0">
          <p class="font-medium text-gray-900 dark:text-white">James Miller</p>
          <p class="text-sm text-gray-500 dark:text-gray-400">james@company.com</p>
        </div>
        <span class="px-2 py-1 text-xs font-medium text-gray-600 dark:text-gray-400 bg-gray-100 dark:bg-gray-800 rounded-full">Member</span>
      </div>
      
      <!-- Member -->
      <div class="flex items-center gap-4 p-3 rounded-xl hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
        <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=48&h=48&fit=crop" class="w-12 h-12 rounded-full object-cover">
        <div class="flex-1 min-w-0">
          <p class="font-medium text-gray-900 dark:text-white">Emma Davis</p>
          <p class="text-sm text-gray-500 dark:text-gray-400">emma@company.com</p>
        </div>
        <span class="px-2 py-1 text-xs font-medium text-gray-600 dark:text-gray-400 bg-gray-100 dark:bg-gray-800 rounded-full">Member</span>
      </div>
      
      <!-- Pending -->
      <div class="flex items-center gap-4 p-3 rounded-xl border border-dashed border-gray-200 dark:border-gray-700">
        <div class="w-12 h-12 bg-gray-100 dark:bg-gray-800 rounded-full flex items-center justify-center">
          <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
          </svg>
        </div>
        <div class="flex-1 min-w-0">
          <p class="font-medium text-gray-900 dark:text-white">Invite Member</p>
          <p class="text-sm text-gray-500 dark:text-gray-400">Add new team members</p>
        </div>
      </div>
    </div>
    
    <!-- Footer -->
    <div class="absolute bottom-0 left-0 right-0 p-6 border-t border-gray-100 dark:border-gray-800 bg-white dark:bg-gray-900">
      <button onclick="closeDrawer('drawer-modal')" class="w-full py-3 text-sm font-medium text-white bg-cyan-600 rounded-xl hover:bg-cyan-700 transition-colors flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        Invite Members
      </button>
    </div>
  </div>
</div>

<!-- Demo Trigger Button -->
<button onclick="openDrawer('drawer-modal')" class="px-6 py-3 bg-cyan-600 text-white font-medium rounded-xl hover:bg-cyan-700 transition-colors focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:ring-offset-2">Open Drawer Modal</button>

<script>
  function openDrawer(id) {
    document.getElementById(id).classList.remove('hidden');
    document.getElementById('drawer-panel').classList.remove('translate-x-full');
    document.body.style.overflow = 'hidden';
  }
  function closeDrawer(id) {
    document.getElementById('drawer-panel').classList.add('translate-x-full');
    setTimeout(() => {
      document.getElementById(id).classList.add('hidden');
    }, 300);
    document.body.style.overflow = '';
  }
</script>
