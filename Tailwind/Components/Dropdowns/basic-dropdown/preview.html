<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Dropdown | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
  
  <!-- Component: Dropdown / Basic Dropdown -->
  
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Dropdown — Basic Dropdown</h1>
      <p class="text-gray-600 mt-2">Simple dropdown menu with click-to-toggle interaction</p>
    </header>

    <!-- Preview -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Preview</h2>
      <div class="flex justify-center p-12 bg-white rounded-xl shadow-sm">
        
        <!-- Basic Dropdown -->
        <div class="relative inline-block">
          <button
            id="dropdown-button"
            class="inline-flex items-center justify-between w-48 px-4 py-2.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-4 focus:ring-blue-100 transition-colors"
            aria-expanded="true"
            aria-haspopup="true"
            onclick="toggleDropdown('dropdown-menu')"
          >
            <span>Select option</span>
            <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </button>
          
          <div
            id="dropdown-menu"
            class="hidden absolute z-10 w-full mt-2 bg-white border border-gray-200 rounded-lg shadow-lg"
          >
            <ul class="py-2">
              <li>
                <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-600">
                  Dashboard
                </a>
              </li>
              <li>
                <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-600">
                  Settings
                </a>
              </li>
              <li>
                <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-600">
                  Earnings
                </a>
              </li>
              <li>
                <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-600">
                  Sign out
                </a>
              </li>
            </ul>
          </div>
        </div>

      </div>
    </div>

  </section>

  <script>
    function toggleDropdown(id) {
      const menu = document.getElementById(id);
      menu.classList.toggle('hidden');
      const button = document.getElementById('dropdown-button');
      const isExpanded = button.getAttribute('aria-expanded') === 'true';
      button.setAttribute('aria-expanded', !isExpanded);
    }

    document.addEventListener('click', function(event) {
      const dropdown = document.querySelector('.relative.inline-block');
      const button = document.getElementById('dropdown-button');
      const menu = document.getElementById('dropdown-menu');
      if (!dropdown.contains(event.target)) {
        menu.classList.add('hidden');
        button.setAttribute('aria-expanded', 'false');
      }
    });
  </script>

</body>
</html>
