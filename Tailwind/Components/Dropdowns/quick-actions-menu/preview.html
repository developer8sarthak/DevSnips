<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Actions Menu | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
  
  <!-- Component: Dropdown / Quick Actions Menu -->
  
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Dropdown — Quick Actions Menu</h1>
      <p class="text-gray-600 mt-2">Grid-based quick actions menu with icon buttons</p>
    </header>

    <!-- Preview -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Preview</h2>
      <div class="flex justify-center p-12 bg-white rounded-xl shadow-sm">
        
        <!-- Quick Actions Menu -->
        <div class="relative inline-block">
          <button
            id="quick-button"
            class="p-3 text-gray-600 hover:text-blue-600 hover:bg-blue-50 rounded-xl border-2 border-gray-200 hover:border-blue-300 transition-all duration-200"
            onclick="toggleDropdown('quick-menu')"
          >
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path>
            </svg>
          </button>

          <div
            id="quick-menu"
            class="hidden absolute right-0 z-20 mt-2 w-80 bg-white rounded-2xl shadow-2xl border border-gray-100 overflow-hidden"
          >
            <!-- Header -->
            <div class="px-5 py-4 bg-gradient-to-r from-gray-50 to-white border-b border-gray-100">
              <div class="flex items-center justify-between">
                <h3 class="font-bold text-gray-900">Quick Actions</h3>
                <span class="px-2 py-0.5 text-xs font-medium text-blue-600 bg-blue-100 rounded-full">8 Available</span>
              </div>
            </div>

            <!-- Actions Grid -->
            <div class="p-3">
              <div class="grid grid-cols-2 gap-2">
                <button class="quick-action flex flex-col items-center gap-2 p-4 rounded-xl hover:bg-blue-50 transition-all duration-200 group">
                  <div class="w-12 h-12 rounded-xl bg-blue-100 flex items-center justify-center text-blue-600 group-hover:scale-110 transition-transform">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                    </svg>
                  </div>
                  <span class="text-xs font-medium text-gray-700 group-hover:text-blue-600">New Task</span>
                </button>

                <button class="quick-action flex flex-col items-center gap-2 p-4 rounded-xl hover:bg-purple-50 transition-all duration-200 group">
                  <div class="w-12 h-12 rounded-xl bg-purple-100 flex items-center justify-center text-purple-600 group-hover:scale-110 transition-transform">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                  </div>
                  <span class="text-xs font-medium text-gray-700 group-hover:text-purple-600">Schedule</span>
                </button>

                <button class="quick-action flex flex-col items-center gap-2 p-4 rounded-xl hover:bg-emerald-50 transition-all duration-200 group">
                  <div class="w-12 h-12 rounded-xl bg-emerald-100 flex items-center justify-center text-emerald-600 group-hover:scale-110 transition-transform">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path>
                    </svg>
                  </div>
                  <span class="text-xs font-medium text-gray-700 group-hover:text-emerald-600">Share</span>
                </button>

                <button class="quick-action flex flex-col items-center gap-2 p-4 rounded-xl hover:bg-amber-50 transition-all duration-200 group">
                  <div class="w-12 h-12 rounded-xl bg-amber-100 flex items-center justify-center text-amber-600 group-hover:scale-110 transition-transform">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                    </svg>
                  </div>
                  <span class="text-xs font-medium text-gray-700 group-hover:text-amber-600">Export</span>
                </button>

                <button class="quick-action flex flex-col items-center gap-2 p-4 rounded-xl hover:bg-rose-50 transition-all duration-200 group">
                  <div class="w-12 h-12 rounded-xl bg-rose-100 flex items-center justify-center text-rose-600 group-hover:scale-110 transition-transform">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                    </svg>
                  </div>
                  <span class="text-xs font-medium text-gray-700 group-hover:text-rose-600">Edit</span>
                </button>

                <button class="quick-action flex flex-col items-center gap-2 p-4 rounded-xl hover:bg-cyan-50 transition-all duration-200 group">
                  <div class="w-12 h-12 rounded-xl bg-cyan-100 flex items-center justify-center text-cyan-600 group-hover:scale-110 transition-transform">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path>
                    </svg>
                  </div>
                  <span class="text-xs font-medium text-gray-700 group-hover:text-cyan-600">Duplicate</span>
                </button>

                <button class="quick-action flex flex-col items-center gap-2 p-4 rounded-xl hover:bg-indigo-50 transition-all duration-200 group">
                  <div class="w-12 h-12 rounded-xl bg-indigo-100 flex items-center justify-center text-indigo-600 group-hover:scale-110 transition-transform">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                    </svg>
                  </div>
                  <span class="text-xs font-medium text-gray-700 group-hover:text-indigo-600">Favorite</span>
                </button>

                <button class="quick-action flex flex-col items-center gap-2 p-4 rounded-xl hover:bg-red-50 transition-all duration-200 group">
                  <div class="w-12 h-12 rounded-xl bg-red-100 flex items-center justify-center text-red-600 group-hover:scale-110 transition-transform">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                    </svg>
                  </div>
                  <span class="text-xs font-medium text-gray-700 group-hover:text-red-600">Delete</span>
                </button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>

  </section>

  <script>
    function toggleDropdown(id) {
      document.getElementById(id).classList.toggle('hidden');
    }

    document.addEventListener('click', function(event) {
      const container = document.querySelector('.relative.inline-block');
      if (!container.contains(event.target)) {
        document.getElementById('quick-menu').classList.add('hidden');
      }
    });
  </script>

</body>
</html>
