<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Menu | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
  
  <!-- Component: Dropdown / Animated Menu -->
  
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Dropdown — Animated Menu</h1>
      <p class="text-gray-600 mt-2">Richly animated dropdown with staggered entrance and hover effects</p>
    </header>

    <!-- Preview -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Preview</h2>
      <div class="flex justify-center p-12 bg-white rounded-xl shadow-sm">
        
        <!-- Animated Menu -->
        <div class="relative inline-block">
          <button
            id="animated-button"
            class="group inline-flex items-center gap-2 px-5 py-2.5 text-sm font-medium text-white bg-gradient-to-r from-blue-600 to-indigo-600 rounded-lg hover:from-blue-700 hover:to-indigo-700 focus:outline-none focus:ring-4 focus:ring-blue-200 transition-all duration-300 shadow-lg shadow-blue-500/25"
            onclick="toggleAnimatedMenu()"
          >
            <span>Animated Menu</span>
            <svg class="w-5 h-5 transition-transform duration-300" id="animated-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </button>

          <div
            id="animated-menu"
            class="hidden absolute left-0 z-20 mt-3 w-72 origin-top-left"
          >
            <div class="bg-white rounded-2xl shadow-2xl border border-gray-100 overflow-hidden">
              <!-- Animated Items -->
              <div class="py-2">
                <a href="#" class="animated-item flex items-center gap-4 px-5 py-4 text-gray-700 hover:bg-gradient-to-r hover:from-blue-50 hover:to-indigo-50 transition-all duration-200">
                  <div class="w-10 h-10 rounded-xl bg-blue-100 flex items-center justify-center text-blue-600 transform group-hover:scale-110 transition-transform duration-200">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                  </div>
                  <div>
                    <p class="font-semibold text-gray-900">Quick Actions</p>
                    <p class="text-xs text-gray-500">Access frequently used</p>
                  </div>
                </a>

                <a href="#" class="animated-item flex items-center gap-4 px-5 py-4 text-gray-700 hover:bg-gradient-to-r hover:from-blue-50 hover:to-indigo-50 transition-all duration-200">
                  <div class="w-10 h-10 rounded-xl bg-purple-100 flex items-center justify-center text-purple-600 transform group-hover:scale-110 transition-transform duration-200">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                    </svg>
                  </div>
                  <div>
                    <p class="font-semibold text-gray-900">Documentation</p>
                    <p class="text-xs text-gray-500">Learn and explore</p>
                  </div>
                </a>

                <a href="#" class="animated-item flex items-center gap-4 px-5 py-4 text-gray-700 hover:bg-gradient-to-r hover:from-blue-50 hover:to-indigo-50 transition-all duration-200">
                  <div class="w-10 h-10 rounded-xl bg-emerald-100 flex items-center justify-center text-emerald-600 transform group-hover:scale-110 transition-transform duration-200">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                    </svg>
                  </div>
                  <div>
                    <p class="font-semibold text-gray-900">Security</p>
                    <p class="text-xs text-gray-500">Manage your security</p>
                  </div>
                </a>
              </div>

              <!-- Divider with Glow Effect -->
              <div class="relative">
                <div class="absolute inset-0 bg-gradient-to-r from-transparent via-blue-500 to-transparent h-px"></div>
              </div>

              <!-- Footer -->
              <div class="px-5 py-4 bg-gradient-to-r from-gray-50 to-white">
                <a href="#" class="flex items-center justify-center gap-2 text-sm font-medium text-blue-600 hover:text-blue-700 transition-colors">
                  <span>View All Options</span>
                  <svg class="w-4 h-4 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path>
                  </svg>
                </a>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>

  </section>

  <script>
    function toggleAnimatedMenu() {
      const menu = document.getElementById('animated-menu');
      const arrow = document.getElementById('animated-arrow');
      
      menu.classList.toggle('hidden');
      arrow.classList.toggle('rotate-180');
      
      // Add animation classes
      if (!menu.classList.contains('hidden')) {
        menu.classList.add('animate-fadeInDown');
        menu.querySelectorAll('.animated-item').forEach((item, index) => {
          item.style.opacity = '0';
          item.style.transform = 'translateX(-20px)';
          setTimeout(() => {
            item.style.transition = 'all 0.3s ease-out';
            item.style.opacity = '1';
            item.style.transform = 'translateX(0)';
          }, index * 100);
        });
      }
    }

    document.addEventListener('click', function(event) {
      const container = document.querySelector('.relative.inline-block');
      if (!container.contains(event.target)) {
        document.getElementById('animated-menu').classList.add('hidden');
        document.getElementById('animated-arrow').classList.remove('rotate-180');
      }
    });
  </script>

  <style>
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-10px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .animate-fadeInDown {
      animation: fadeInDown 0.3s ease-out forwards;
    }
  </style>

</body>
</html>
