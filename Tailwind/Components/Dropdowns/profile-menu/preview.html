<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Menu | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
  
  <!-- Component: Dropdown / Profile Menu -->
  
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Dropdown — Profile Menu</h1>
      <p class="text-gray-600 mt-2">User profile dropdown with avatar, info header, and account actions</p>
    </header>

    <!-- Preview -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Preview</h2>
      <div class="flex justify-center p-12 bg-white rounded-xl shadow-sm">
        
        <!-- Profile Menu -->
        <div class="relative inline-block">
          <button
            id="profile-button"
            class="flex items-center gap-3 px-4 py-2 rounded-full hover:bg-gray-100 focus:outline-none focus:ring-4 focus:ring-blue-100 transition-all"
            aria-expanded="true"
            aria-haspopup="true"
            onclick="toggleDropdown('profile-menu')"
          >
            <img
              src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80&h=80&fit=crop&crop=faces"
              alt="User avatar"
              class="w-10 h-10 rounded-full object-cover border-2 border-white shadow-sm"
            />
            <div class="text-left hidden sm:block">
              <p class="text-sm font-semibold text-gray-900">Alexander Chen</p>
              <p class="text-xs text-gray-500">Product Designer</p>
            </div>
            <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </button>

          <div
            id="profile-menu"
            class="hidden absolute right-0 z-20 mt-3 w-72 bg-white rounded-xl shadow-xl border border-gray-100 overflow-hidden"
          >
            <!-- User Info Header -->
            <div class="px-5 py-4 bg-gradient-to-r from-blue-600 to-indigo-600">
              <div class="flex items-center gap-3">
                <img
                  src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80&h=80&fit=crop&crop=faces"
                  alt="User avatar"
                  class="w-12 h-12 rounded-full object-cover border-2 border-white"
                />
                <div>
                  <p class="text-white font-semibold">Alexander Chen</p>
                  <p class="text-blue-100 text-sm">alex.chen@designstudio.io</p>
                </div>
              </div>
            </div>

            <!-- Menu Items -->
            <div class="py-2">
              <a href="#" class="flex items-center gap-3 px-5 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition-colors">
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
                <span>My Profile</span>
              </a>
              <a href="#" class="flex items-center gap-3 px-5 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition-colors">
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
                <span>Settings</span>
              </a>
              <a href="#" class="flex items-center gap-3 px-5 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition-colors">
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span>Billing</span>
                <span class="ml-auto px-2 py-0.5 text-xs font-medium text-blue-600 bg-blue-100 rounded-full">Pro</span>
              </a>
            </div>

            <!-- Divider -->
            <div class="border-t border-gray-100"></div>

            <!-- Bottom Actions -->
            <div class="py-2">
              <a href="#" class="flex items-center gap-3 px-5 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition-colors">
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span>Help Center</span>
              </a>
              <a href="#" class="flex items-center gap-3 px-5 py-2.5 text-sm text-red-600 hover:bg-red-50 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                </svg>
                <span>Sign out</span>
              </a>
            </div>
          </div>
        </div>

      </div>
    </div>

  </section>

  <script>
    function toggleDropdown(id) {
      const menu = document.getElementById(id);
      menu.classList.toggle('hidden');
      const button = document.getElementById('profile-button');
      const isExpanded = button.getAttribute('aria-expanded') === 'true';
      button.setAttribute('aria-expanded', !isExpanded);
    }

    document.addEventListener('click', function(event) {
      const dropdown = document.querySelector('.relative.inline-block');
      const button = document.getElementById('profile-button');
      const menu = document.getElementById('profile-menu');
      if (!dropdown.contains(event.target)) {
        menu.classList.add('hidden');
        button.setAttribute('aria-expanded', 'false');
      }
    });
  </script>

</body>
</html>
