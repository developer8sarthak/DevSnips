<!-- Checkbox Menu -->
<div class="relative inline-block">
  <button
    id="checkbox-button"
    class="inline-flex items-center gap-2 px-4 py-2.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors"
    onclick="toggleDropdown('checkbox-menu')"
  >
    <span>Columns</span>
    <span id="checkbox-count" class="hidden px-1.5 py-0.5 text-xs font-medium text-white bg-blue-600 rounded-full">0</span>
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
    </svg>
  </button>

  <div
    id="checkbox-menu"
    class="hidden absolute left-0 z-20 mt-2 w-64 bg-white rounded-xl shadow-xl border border-gray-200 overflow-hidden"
  >
    <div class="px-4 py-3 border-b border-gray-100">
      <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Toggle Columns</p>
    </div>

    <div class="py-2 max-h-80 overflow-y-auto">
      <label class="flex items-center gap-3 px-4 py-2.5 cursor-pointer hover:bg-blue-50 transition-colors">
        <input type="checkbox" class="column-checkbox w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500" data-column="name" checked onchange="updateColumnCount()">
        <span class="text-sm text-gray-700">Name</span>
      </label>
      
      <label class="flex items-center gap-3 px-4 py-2.5 cursor-pointer hover:bg-blue-50 transition-colors">
        <input type="checkbox" class="column-checkbox w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500" data-column="email" checked onchange="updateColumnCount()">
        <span class="text-sm text-gray-700">Email</span>
      </label>
      
      <label class="flex items-center gap-3 px-4 py-2.5 cursor-pointer hover:bg-blue-50 transition-colors">
        <input type="checkbox" class="column-checkbox w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500" data-column="role" checked onchange="updateColumnCount()">
        <span class="text-sm text-gray-700">Role</span>
      </label>
      
      <label class="flex items-center gap-3 px-4 py-2.5 cursor-pointer hover:bg-blue-50 transition-colors">
        <input type="checkbox" class="column-checkbox w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500" data-column="status" onchange="updateColumnCount()">
        <span class="text-sm text-gray-700">Status</span>
      </label>
      
      <label class="flex items-center gap-3 px-4 py-2.5 cursor-pointer hover:bg-blue-50 transition-colors">
        <input type="checkbox" class="column-checkbox w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500" data-column="department" onchange="updateColumnCount()">
        <span class="text-sm text-gray-700">Department</span>
      </label>
      
      <label class="flex items-center gap-3 px-4 py-2.5 cursor-pointer hover:bg-blue-50 transition-colors">
        <input type="checkbox" class="column-checkbox w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500" data-column="phone" onchange="updateColumnCount()">
        <span class="text-sm text-gray-700">Phone</span>
      </label>
      
      <label class="flex items-center gap-3 px-4 py-2.5 cursor-pointer hover:bg-blue-50 transition-colors">
        <input type="checkbox" class="column-checkbox w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500" data-column="location" onchange="updateColumnCount()">
        <span class="text-sm text-gray-700">Location</span>
      </label>
      
      <label class="flex items-center gap-3 px-4 py-2.5 cursor-pointer hover:bg-blue-50 transition-colors">
        <input type="checkbox" class="column-checkbox w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500" data-column="joined" onchange="updateColumnCount()">
        <span class="text-sm text-gray-700">Joined Date</span>
      </label>
    </div>

    <div class="px-4 py-3 bg-gray-50 border-t border-gray-100 flex items-center justify-between">
      <button class="text-xs font-medium text-blue-600 hover:text-blue-700" onclick="resetColumns()">Reset to default</button>
      <button class="px-3 py-1.5 text-xs font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700" onclick="applyColumns()">Done</button>
    </div>
  </div>
</div>

<script>
  function toggleDropdown(id) {
    document.getElementById(id).classList.toggle('hidden');
  }

  function updateColumnCount() {
    const checked = document.querySelectorAll('.column-checkbox:checked');
    const countEl = document.getElementById('checkbox-count');
    
    if (checked.length > 0) {
      countEl.textContent = checked.length;
      countEl.classList.remove('hidden');
    } else {
      countEl.classList.add('hidden');
    }
  }

  function resetColumns() {
    document.querySelectorAll('.column-checkbox').forEach((cb, index) => {
      cb.checked = index < 3;
    });
    updateColumnCount();
  }

  function applyColumns() {
    toggleDropdown('checkbox-menu');
  }

  document.addEventListener('click', function(event) {
    const container = document.querySelector('.relative.inline-block');
    if (!container.contains(event.target)) {
      document.getElementById('checkbox-menu').classList.add('hidden');
    }
  });
</script>
