<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icon Menu | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
  
  <!-- Component: Dropdown / Icon Menu -->
  
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Dropdown — Icon Menu</h1>
      <p class="text-gray-600 mt-2">Icon-based menu dropdowns with notification badges</p>
    </header>

    <!-- Preview -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Preview</h2>
      <div class="flex justify-center p-12 bg-white rounded-xl shadow-sm">
        
        <!-- Icon Menu -->
        <div class="flex items-center gap-4">
          <!-- Home Icon -->
          <div class="relative">
            <button class="p-3 text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors" onclick="toggleIconMenu('home-menu')">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
              </svg>
            </button>
            <div id="home-menu" class="hidden absolute top-full left-1/2 -translate-x-1/2 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-2">
              <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-blue-50">Home</a>
              <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-blue-50">About</a>
              <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-blue-50">Contact</a>
            </div>
          </div>

          <!-- Settings Icon -->
          <div class="relative">
            <button class="p-3 text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors" onclick="toggleIconMenu('settings-menu')">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              </svg>
            </button>
            <div id="settings-menu" class="hidden absolute top-full left-1/2 -translate-x-1/2 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-2">
              <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-blue-50">General</a>
              <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-blue-50">Privacy</a>
              <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-blue-50">Security</a>
            </div>
          </div>

          <!-- Bell Icon -->
          <div class="relative">
            <button class="p-3 text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors" onclick="toggleIconMenu('bell-menu')">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
              </svg>
              <span class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full"></span>
            </button>
            <div id="bell-menu" class="hidden absolute top-full right-0 mt-2 w-72 bg-white rounded-xl shadow-xl border border-gray-200 overflow-hidden">
              <div class="px-4 py-3 border-b border-gray-100">
                <p class="font-semibold text-gray-900">Notifications</p>
              </div>
              <div class="py-2">
                <a href="#" class="flex items-start gap-3 px-4 py-3 hover:bg-gray-50">
                  <div class="w-2 h-2 bg-blue-500 rounded-full mt-2"></div>
                  <div>
                    <p class="text-sm text-gray-900">New message received</p>
                    <p class="text-xs text-gray-500">2 minutes ago</p>
                  </div>
                </a>
                <a href="#" class="flex items-start gap-3 px-4 py-3 hover:bg-gray-50">
                  <div class="w-2 h-2 bg-emerald-500 rounded-full mt-2"></div>
                  <div>
                    <p class="text-sm text-gray-900">Task completed</p>
                    <p class="text-xs text-gray-500">15 minutes ago</p>
                  </div>
                </a>
              </div>
            </div>
          </div>

          <!-- User Icon -->
          <div class="relative">
            <button class="p-3 text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors" onclick="toggleIconMenu('user-menu')">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
            </button>
            <div id="user-menu" class="hidden absolute top-full right-0 mt-2 w-56 bg-white rounded-xl shadow-xl border border-gray-200 py-2">
              <div class="px-4 py-2 border-b border-gray-100">
                <p class="font-medium text-gray-900">Alex Chen</p>
                <p class="text-xs text-gray-500">alex@example.com</p>
              </div>
              <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-blue-50">Profile</a>
              <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-blue-50">Settings</a>
              <a href="#" class="block px-4 py-2 text-sm text-red-600 hover:bg-red-50">Sign out</a>
            </div>
          </div>
        </div>

      </div>
    </div>

  </section>

  <script>
    function toggleIconMenu(id) {
      document.getElementById(id).classList.toggle('hidden');
    }

    document.addEventListener('click', function(event) {
      document.querySelectorAll('[id$="-menu"]').forEach(menu => {
        if (!menu.contains(event.target) && !menu.previousElementSibling?.contains(event.target)) {
          menu.classList.add('hidden');
        }
      });
    });
  </script>

</body>
</html>
